<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Weekly Summary — I SEE YOU & YOU ARE PERFECT</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I SEE YOU">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  html, body { background:#000; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000000; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

  .card { background:#0a0a0b; border:1px solid #18181b; }
  .btn-primary { background:#dc2626; box-shadow: 0 0 22px rgba(220,38,38,0.35); transition: all .18s ease; }
  .btn-primary:hover { background:#ef4444; }

  #loading-overlay { background:#000; }
  .spinner { border: 2.5px solid #27272a; border-top-color:#dc2626; border-radius:50%; width:28px; height:28px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-black text-zinc-100">
<div class="max-w-md mx-auto min-h-screen bg-black flex flex-col relative border-x border-zinc-900">

  <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="spinner"></div>
  </div>

  <div id="app-content" class="hidden flex-1 flex flex-col">
    <!-- Header -->
    <div class="sticky top-0 z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="flex-1">
        <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Tactical Review</p>
        <h2 class="font-black italic uppercase text-base leading-tight">Positional Analytics</h2>
      </div>
      <img src="logo-bird-only-v2.png" alt="I See You" class="h-8 w-auto shrink-0">
    </div>

    <div class="flex-1 px-5 py-5 space-y-5 pb-12">
      
      <!-- Top Metrics Row -->
      <div class="grid grid-cols-2 gap-3">
        <div class="card rounded-xl p-4">
          <p class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Sessions Logged</p>
          <p id="stat-sessions" class="text-3xl font-black italic text-white">0</p>
        </div>
        <div class="card rounded-xl p-4">
          <p class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Total Rounds</p>
          <p id="stat-rounds" class="text-3xl font-black italic text-red-500">0</p>
        </div>
      </div>

      <!-- Top vs Bottom Game Balance -->
      <div class="card rounded-xl p-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-black italic uppercase text-xs tracking-[0.2em] text-zinc-200">Role Balance</h3>
          <span id="role-ratio-text" class="text-[10px] font-bold text-red-500 uppercase">0% Top / 0% Bottom</span>
        </div>
        <div class="w-full h-3 bg-zinc-900 rounded-full overflow-hidden flex">
          <div id="bar-top" class="h-full bg-red-600 transition-all duration-500" style="width: 50%;"></div>
          <div id="bar-bottom" class="h-full bg-zinc-700 transition-all duration-500" style="width: 50%;"></div>
        </div>
        <div class="flex justify-between text-[9px] font-bold uppercase tracking-wider text-zinc-500 mt-2">
          <span class="flex items-center gap-1"><span class="w-2 h-2 bg-red-600 rounded-full inline-block"></span> Top / Passing</span>
          <span class="flex items-center gap-1">Bottom / Guard <span class="w-2 h-2 bg-zinc-700 rounded-full inline-block"></span></span>
        </div>
      </div>

      <!-- Positional Distribution Chart -->
      <div class="card rounded-xl p-4">
        <h3 class="font-black italic uppercase text-xs tracking-[0.2em] text-zinc-200 mb-4 flex items-center gap-2">
          <span class="w-1.5 h-1.5 bg-red-600 rounded-full inline-block"></span> Positional Breakdown
        </h3>
        <div class="relative w-full h-64">
          <canvas id="positionChart"></canvas>
        </div>
      </div>

      <!-- Recent Focus Areas -->
      <div class="card rounded-xl p-4">
        <h3 class="font-black italic uppercase text-xs tracking-[0.2em] text-zinc-200 mb-3">Logged Focus Areas</h3>
        <div id="focus-list" class="space-y-2">
          <p class="text-xs text-zinc-500 italic">No training sessions recorded yet.</p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(async function(){
  const session = await requireSession();
  if(!session) return;

  const uid = session.user.id;

  // Fetch training sessions
  const { data: trainings, error } = await sb
    .from('trainings')
    .select('*')
    .eq('user_id', uid)
    .order('training_date', { ascending: false });

  if(error) console.error(error);

  const logs = trainings || [];

  // Metrics
  const totalSessions = logs.length;
  const totalRounds = logs.reduce((sum, l) => sum + (l.rounds || 0), 0);

  document.getElementById('stat-sessions').textContent = totalSessions;
  document.getElementById('stat-rounds').textContent = totalRounds;

  // Positional counters
  let positions = {
    'Open Guard': 0,
    'Closed Guard': 0,
    'Side Control': 0,
    'Mount': 0,
    'Back Control': 0
  };

  let topCount = 0;
  let bottomCount = 0;

  logs.forEach(l => {
    const focus = (l.focus || '').toLowerCase();

    // Role check
    if (focus.includes('top') || focus.includes('pass') || focus.includes('pin') || focus.includes('mount attacker')) topCount++;
    if (focus.includes('bottom') || focus.includes('guard') || focus.includes('escape') || focus.includes('sweep')) bottomCount++;

    // Position check
    if (focus.includes('open guard')) positions['Open Guard']++;
    else if (focus.includes('closed guard')) positions['Closed Guard']++;
    else if (focus.includes('side control')) positions['Side Control']++;
    else if (focus.includes('mount')) positions['Mount']++;
    else if (focus.includes('back control') || focus.includes('rear')) positions['Back Control']++;
  });

  // Calculate Role Ratio
  const totalRoles = topCount + bottomCount || 1;
  const topPct = Math.round((topCount / totalRoles) * 100);
  const botPct = 100 - topPct;

  document.getElementById('bar-top').style.width = `${topPct}%`;
  document.getElementById('bar-bottom').style.width = `${botPct}%`;
  document.getElementById('role-ratio-text').textContent = `${topPct}% Top / ${botPct}% Bottom`;

  // Render Focus List
  const focusList = document.getElementById('focus-list');
  if (logs.length > 0) {
    focusList.innerHTML = logs.slice(0, 5).map(l => `
      <div class="bg-black/60 rounded-lg p-3 border border-zinc-800 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold text-white uppercase">${l.focus || 'General Rolling'}</p>
          <p class="text-[10px] text-zinc-500">${l.training_date} · ${l.class_attended || 'Class'}</p>
        </div>
        <span class="text-xs font-black italic text-red-500">${l.rounds || 0} Rd</span>
      </div>
    `).join('');
  }

  // Render Chart.js Bar Chart
  const ctx = document.getElementById('positionChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(positions),
      datasets: [{
        label: 'Sessions Logged',
        data: Object.values(positions),
        backgroundColor: '#dc2626',
        borderRadius: 6,
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: '#a1a1aa', font: { family: 'Inter', size: 10, weight: '700' } }
        },
        y: {
          grid: { color: '#18181b' },
          ticks: { color: '#52525b', precision: 0, font: { family: 'Inter', size: 10 } }
        }
      }
    }
  });

  document.getElementById('loading-overlay').classList.add('hidden');
  document.getElementById('app-content').classList.remove('hidden');
})();
</script>
</body>
</html>
