  .day-cell { transition: all .15s ease; cursor: pointer; }

  .day-cell.has-log::after {

  }
  .day-cell.is-today { box-shadow: inset 0 0 0 1.5px #dc2626; }

  .stripe { transition: all .25s ease; }
  .stripe.filled { background:#dc2626; box-shadow: 0 0 8px rgba(220,38,38,0.7); }
  .stripe.empty { background:#27272a; }
