    background: rgba(10, 10, 11, 0.96);

<body class="bg-black text-zinc-100 flex flex-col h-screen w-screen overflow-hidden">

<div class="max-w-md mx-auto w-full h-full flex flex-col relative border-x border-zinc-900 overflow-hidden">

  <!-- Header -->
  <div class="z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3 shrink-0">
    <a href="training-log.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="flex-1">
      <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Tactical System</p>
      <h2 class="font-black italic uppercase text-base leading-tight">Top / Bottom Stack</h2>
    </div>
    <img src="logo-bird-only-v2.png" alt="I See You & You Are Perfect" class="h-8 w-auto shrink-0">
  </div>

  <!-- Search Bar -->
  <div class="absolute top-16 left-3 right-3 z-20">
    <div class="control-pill rounded-xl p-2 shadow-2xl flex items-center gap-2">

  <!-- Drawer Popup Panel -->

        <a id="drawer-yt-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary flex items-center justify-center gap-2 w-full py-3 rounded-xl text-white font-black italic uppercase text-xs tracking-wide shrink-0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          Watch Tutorial Video →

</div>

<script>
(function(){
  const stylePrimary = {
    shape: 'box',
    margin: 12,
    color: { background: '#dc2626', border: '#f87171' },
    font: { color: '#ffffff', face: 'Inter', weight: '900', size: 13 },
    shapeProperties: { borderRadius: 8 }
  };

  const styleSubRole = {
    shape: 'box',
    margin: 10,
    color: { background: '#18181b', border: '#3f3f46' },
    font: { color: '#f4f4f5', face: 'Inter', weight: '800', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  const styleTransition = {
    shape: 'box',
    margin: 10,
    color: { background: '#ffffff', border: '#e4e4e7' },
    font: { color: '#000000', face: 'Inter', weight: '800', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  const styleSubmission = {
    shape: 'box',
    margin: 10,
    color: { background: '#dc2626', border: '#7f1d1d' },
    font: { color: '#000000', face: 'Inter', weight: '900', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  // Node dataset mapped to explicit (x, y) coordinates:
  // Primary positions are strictly locked at x: 0 (vertical spine column)
  // Top roles/attacks extend left (x < 0), Bottom roles/attacks extend right (x > 0)
  const nodes = new vis.DataSet([
    // ==========================================
    // 1. OPEN GUARD (Spine at Y = 0)
    // ==========================================
    { id: 'og', label: '1. OPEN GUARD', x: 0, y: 0, category: 'Primary Position', desc: 'Background Process: The fight for inside leg space. The player who controls the inside space dictates whether guard is retained, swept, or passed.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=390s', ...stylePrimary },
    
    { id: 'og_top', label: 'TOP (Passing / Standing)', x: -200, y: 100, category: 'Guard Passing', desc: 'Background Process: Deny inside leg connections. Strip foot grips, step into or around inside space, and force bottom player flat.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=736s', ...styleSubRole },
    { id: 'og_bot', label: 'BOTTOM (Guard Playing)', x: 220, y: 100, category: 'Guard Playing', desc: 'Background Process: Win inside leg position. Place feet on hips/biceps to off balance (Kuzushi) and force top player to post hands on the mat.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=390s', ...styleSubRole },
    
    { id: 'og_top_torreando', label: 'Torreando / Bullfighter Pass', x: -300, y: 200, category: 'Top Pass', desc: 'Deny inside leg connection by gripping pant cuffs, pushing legs laterally, and occupying inside chest-to-hip space.', yt: 'https://www.youtube.com/results?search_query=bjj+torreando+pass+tutorial', ...styleTransition },
    { id: 'og_top_kneecut', label: 'Knee Cut / Slice Pass', x: -110, y: 200, category: 'Top Pass', desc: 'Drive knee through inside leg space while establishing an underhook to win inside arm space before passing.', yt: 'https://www.youtube.com/results?search_query=bjj+knee+cut+pass+tutorial', ...styleTransition },
    
    { id: 'og_bot_dlr', label: 'De La Riva Guard', x: 70, y: 200, category: 'Bottom Guard', desc: 'Use outside hook behind ankle to establish inside control of passer far leg, breaking posture and setting up sweeps.', yt: 'https://www.youtube.com/results?search_query=bjj+de+la+riva+guard+sweeps', ...styleTransition },
    { id: 'og_bot_spider', label: 'Spider Guard', x: 180, y: 200, category: 'Bottom Guard', desc: 'Place feet directly on biceps to win inside arm/leg space, stretching passer out to off balance (Kuzushi).', yt: 'https://www.youtube.com/results?search_query=bjj+spider+guard+sweeps', ...styleTransition },
    { id: 'og_bot_slx', label: 'Single Leg X-Guard', x: 290, y: 200, category: 'Bottom Guard', desc: 'Pinch isolated leg between your thighs with foot on hip to gain complete inside leg control and off balance (Kuzushi).', yt: 'https://www.youtube.com/results?search_query=bjj+single+leg+x+guard+sweeps', ...styleTransition },
    { id: 'og_bot_tripod', label: 'Tripod Sweep', x: 400, y: 200, category: 'Bottom Sweep', desc: 'Combine inside foot-on-hip push with outside ankle hook to off balance (Kuzushi) passer onto their back.', yt: 'https://www.youtube.com/results?search_query=bjj+tripod+sweep+tutorial', ...styleTransition },

    // ==========================================
    // 2. CLOSED GUARD (Spine at Y = 350)
    // ==========================================
    { id: 'cg', label: '2. CLOSED GUARD', x: 0, y: 350, category: 'Primary Position', desc: 'Background Process: Controlling top player posture and hips with locked leg enclosure.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=390s', ...stylePrimary },
    
    { id: 'cg_top', label: 'TOP (Inside Guard)', x: -200, y: 450, category: 'Top Defense', desc: 'Background Process: Maintain vertical posture, keep elbows inside knees to prevent arm control, and open ankle lock.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=736s', ...styleSubRole },
    { id: 'cg_bot', label: 'BOTTOM (Guard Controller)', x: 220, y: 450, category: 'Bottom Offense', desc: 'Background Process: Break posture down, pull passer past your hip line, and isolate an arm by winning inside grip space.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=390s', ...styleSubRole },
    
    { id: 'cg_top_standingbreak', label: 'Standing Guard Break', x: -290, y: 550, category: 'Top Break', desc: 'Post feet under hips and stand straight up, keeping hands glued inside hips to force ankle lock open.', yt: 'https://www.youtube.com/results?search_query=bjj+standing+closed+guard+break', ...styleTransition },
    { id: 'cg_top_saucepan', label: 'Log Saw / Elbow Break', x: -110, y: 550, category: 'Top Break', desc: 'Drive elbow into inner thigh space while wedging knee behind tailbone to break ankle lock.', yt: 'https://www.youtube.com/results?search_query=bjj+seated+closed+guard+break', ...styleTransition },
    
    { id: 'cg_bot_armbar', label: 'Armbar', x: 50, y: 550, category: 'Bottom Submission', desc: 'Win inside arm angle by pivoting 90 degrees across chest, trapping shoulder with clamped leg posture.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+armbar+details', ...styleSubmission },
    { id: 'cg_bot_triangle', label: 'Triangle Choke', x: 150, y: 550, category: 'Bottom Submission', desc: 'Isolate one arm inside and push one arm out, locking shin across neck line to close space.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+triangle+choke+finish', ...styleSubmission },
    { id: 'cg_bot_kimura', label: 'Kimura', x: 250, y: 550, category: 'Bottom Submission', desc: 'Break wrist grip, sit up over shoulder to win inside arm space, locking figure-four wrist lock.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+kimura+system', ...styleSubmission },
    { id: 'cg_bot_omoplata', label: 'Omoplata', x: 350, y: 550, category: 'Bottom Submission', desc: 'Swing leg over shoulder to lock arm inside hips, driving forward to break shoulder structure.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+omoplata+details', ...styleSubmission },
    { id: 'cg_bot_hipheist', label: 'Hip Heist / Flower Sweep', x: 450, y: 550, category: 'Bottom Sweep', desc: 'Off balance (Kuzushi) top player by controlling arm/sleeve line and pivoting hip momentum under center of gravity.', yt: 'https://www.youtube.com/results?search_query=bjj+flower+sweep+closed+guard', ...styleTransition },

    // ==========================================
    // 3. SIDE CONTROL (Spine at Y = 700)
    // ==========================================
    { id: 'sc', label: '3. SIDE CONTROL', x: 0, y: 700, category: 'Primary Position', desc: 'Background Process: The fight for inside arm space. Top player needs underhooks/cross-face; bottom player needs frames.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1406s', ...stylePrimary },
    
    { id: 'sc_top', label: 'TOP (Dominant Pin)', x: -200, y: 800, category: 'Top Offense', desc: 'Background Process: Drive arms, chest, or head inside defender arms (underhook/cross-face) to flatten shoulders and eliminate escape routes.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1406s', ...styleSubRole },
    { id: 'sc_bot', label: 'BOTTOM (Pinned Defender)', x: 200, y: 800, category: 'Bottom Defense', desc: 'Background Process: Deny inside arm space. Keep elbows glued to ribs, frame across neck/hip, and avoid giving up underhooks.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1730s', ...styleSubRole },
    
    { id: 'sc_top_papercutter', label: 'Paper Cutter Choke', x: -320, y: 900, category: 'Top Submission', desc: 'Work inside lapel grip and drop forearm across throat line while maintaining heavy cross-body pressure.', yt: 'https://www.youtube.com/results?search_query=bjj+paper+cutter+choke+side+control', ...styleSubmission },
    { id: 'sc_top_armtriangle', label: 'Arm Triangle (Head & Arm)', x: -200, y: 900, category: 'Top Submission', desc: 'Trap defender arm across their neck line, sliding into inside position to choke with shoulder pressure.', yt: 'https://www.youtube.com/results?search_query=bjj+arm+triangle+from+side+control+finish', ...styleSubmission },
    { id: 'sc_top_kimuratrap', label: 'Kimura Trap', x: -80, y: 900, category: 'Top Transition', desc: 'Secure figure-four lock on near arm inside space to control defender rotations and take back.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+kimura+trap+system', ...styleTransition },
    
    { id: 'sc_bot_shrimp', label: 'Shrimp Guard Recovery', x: 100, y: 900, category: 'Bottom Escape', desc: 'Protect inside arm space with frames, bridge to create hip room, and slide knee inside to restore guard.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+shrimp+escape+tutorial', ...styleTransition },
    { id: 'sc_bot_underhook', label: 'Underhook to Dogbar / Single', x: 260, y: 900, category: 'Bottom Escape', desc: 'Pummel arm inside to gain underhook, coming up to knees to reverse top/bottom dynamic.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+underhook+escape+tutorial', ...styleTransition },

    // ==========================================
    // 4. MOUNT (Spine at Y = 1050)
    // ==========================================
    { id: 'm', label: '4. MOUNT', x: 0, y: 1050, category: 'Primary Position', desc: 'Background Process: Top player walks knees high inside defender armpits; bottom player protects neck and hip space.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1406s', ...stylePrimary },
    
    { id: 'm_top', label: 'TOP (Mount Attacker)', x: -200, y: 1150, category: 'Top Offense', desc: 'Background Process: Walk knees up to win inside armpit space, isolating elbows away from ribs to set up submissions.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1406s', ...styleSubRole },
    { id: 'm_bot', label: 'BOTTOM (Mounted Defender)', x: 200, y: 1150, category: 'Bottom Defense', desc: 'Background Process: Protect inside neck and arm space. Keep elbows tight to hip bone to prevent high mount.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1730s', ...styleSubRole },
    
    { id: 'm_top_smountarmbar', label: 'S-Mount Armbar', x: -320, y: 1250, category: 'Top Submission', desc: 'Wedge leg high into inside armpit space, isolating far arm before stepping leg over head.', yt: 'https://www.youtube.com/results?search_query=bjj+s+mount+armbar+details', ...styleSubmission },
    { id: 'm_top_crosscollar', label: 'Cross Collar Choke', x: -200, y: 1250, category: 'Top Submission', desc: 'Slide thumb deep inside collar, cross second arm under chin line, and drop weight forward.', yt: 'https://www.youtube.com/results?search_query=bjj+mounted+cross+collar+choke+finish', ...styleSubmission },
    { id: 'm_top_ezekiel', label: 'Ezekiel Choke', x: -80, y: 1250, category: 'Top Submission', desc: 'Wrap arm behind neck and slide fist inside sleeve cuff across throat line.', yt: 'https://www.youtube.com/results?search_query=bjj+mounted+ezekiel+choke+tutorial', ...styleSubmission },
    
    { id: 'm_bot_elbowescape', label: 'Elbow-Knee Escape', x: 100, y: 1250, category: 'Bottom Escape', desc: 'Turn onto hip, use inside elbow to frame top knee down, and slip foot through to half guard.', yt: 'https://www.youtube.com/results?search_query=bjj+mount+elbow+knee+escape+tutorial', ...styleTransition },
    { id: 'm_bot_upa', label: 'Upa / Bridge & Roll Escape', x: 260, y: 1250, category: 'Bottom Escape', desc: 'Trap top player arm and same-side foot line, bridging diagonally to reverse position.', yt: 'https://www.youtube.com/results?search_query=bjj+upa+escape+mount+tutorial', ...styleTransition },

    // ==========================================
    // 5. BACK CONTROL (Spine at Y = 1400)
    // ==========================================
    { id: 'bc', label: '5. BACK CONTROL', x: 0, y: 1400, category: 'Primary Position', desc: 'Background Process: Attacker fights to control chest-to-back inside space and neck line; defender clear hooks.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1406s', ...stylePrimary },
    
    { id: 'bc_top', label: 'TOP / REAR ATTACKER', x: -200, y: 1500, category: 'Rear Offense', desc: 'Background Process: Maintain seatbelt control, trap defending wrist inside legs, and control chin line.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1406s', ...styleSubRole },
    { id: 'bc_bot', label: 'BOTTOM / DEFENDER', x: 200, y: 1500, category: 'Rear Defense', desc: 'Background Process: Deny choke arm inside space, protect collar grips, and slide shoulders flat to mat.', yt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1730s', ...styleSubRole },
    
    { id: 'bc_top_rnc', label: 'Rear Naked Choke (RNC)', x: -320, y: 1600, category: 'Rear Submission', desc: 'Slide choking arm deep inside under chin, lock biceps grip behind head, and compress chest.', yt: 'https://www.youtube.com/results?search_query=bjj+rear+naked+choke+finish+details', ...styleSubmission },
    { id: 'bc_top_bowandarrow', label: 'Bow & Arrow Choke', x: -200, y: 1600, category: 'Rear Submission', desc: 'Grip inside collar, grab far pant cuff, and rotate perpendicular to apply leverage against neck.', yt: 'https://www.youtube.com/results?search_query=bjj+bow+and+arrow+choke+finish', ...styleSubmission },
    { id: 'bc_top_straightjacket', label: 'Straight Jacket Trap', x: -80, y: 1600, category: 'Rear Attack', desc: 'Use leg hook to trap defender defending hand inside, isolating neck for an undefended choke.', yt: 'https://www.youtube.com/results?search_query=bjj+straight+jacket+back+system+tutorial', ...styleTransition },
    
    { id: 'bc_bot_scapulaescape', label: 'Shoulder-to-Mat Escape', x: 160, y: 1600, category: 'Rear Escape', desc: 'Control choking wrist, clear top hook, and slide hips sideways to get shoulders flat on the mat.', yt: 'https://www.youtube.com/results?search_query=bjj+back+control+escape+shoulders+to+mat', ...styleTransition }
  ]);

  const edges = new vis.DataSet([
    { from: 'og', to: 'og_top' },
    { from: 'og', to: 'og_bot' },
    { from: 'og_top', to: 'og_top_torreando' },
    { from: 'og_top', to: 'og_top_kneecut' },
    { from: 'og_bot', to: 'og_bot_dlr' },
    { from: 'og_bot', to: 'og_bot_spider' },
    { from: 'og_bot', to: 'og_bot_slx' },
    { from: 'og_bot', to: 'og_bot_tripod' },
    
    { from: 'cg', to: 'cg_top' },
    { from: 'cg', to: 'cg_bot' },
    { from: 'cg_top', to: 'cg_top_standingbreak' },
    { from: 'cg_top', to: 'cg_top_saucepan' },
    { from: 'cg_bot', to: 'cg_bot_armbar' },
    { from: 'cg_bot', to: 'cg_bot_triangle' },
    { from: 'cg_bot', to: 'cg_bot_kimura' },
    { from: 'cg_bot', to: 'cg_bot_omoplata' },
    { from: 'cg_bot', to: 'cg_bot_hipheist' },
    
    { from: 'sc', to: 'sc_top' },
    { from: 'sc', to: 'sc_bot' },
    { from: 'sc_top', to: 'sc_top_papercutter' },
    { from: 'sc_top', to: 'sc_top_armtriangle' },
    { from: 'sc_top', to: 'sc_top_kimuratrap' },
    { from: 'sc_bot', to: 'sc_bot_shrimp' },
    { from: 'sc_bot', to: 'sc_bot_underhook' },
    
    { from: 'm', to: 'm_top' },
    { from: 'm', to: 'm_bot' },
    { from: 'm_top', to: 'm_top_smountarmbar' },
    { from: 'm_top', to: 'm_top_crosscollar' },
    { from: 'm_top', to: 'm_top_ezekiel' },
    { from: 'm_bot', to: 'm_bot_elbowescape' },
    { from: 'm_bot', to: 'm_bot_upa' },
    
    { from: 'bc', to: 'bc_top' },
    { from: 'bc', to: 'bc_bot' },
    { from: 'bc_top', to: 'bc_top_rnc' },
    { from: 'bc_top', to: 'bc_top_bowandarrow' },
    { from: 'bc_top', to: 'bc_top_straightjacket' },
    { from: 'bc_bot', to: 'bc_bot_scapulaescape' }
  ]);

  const container = document.getElementById('network-container');
  const data = { nodes: nodes, edges: edges };

  // Explicit coordinate grid solver (hierarchical auto-calculation disabled)
  const options = {
    physics: { enabled: false },
    edges: {
      arrows: { to: { enabled: true, scaleFactor: 0.5 } },
      color: { color: '#dc2626', highlight: '#ef4444' },
      width: 1.5,
      smooth: { type: 'cubicBezier', forceDirection: 'vertical' }
    },
    interaction: { hover: true, zoomView: true, dragView: true }
  };

  const network = new vis.Network(container, data, options);

  // Popup drawer elements
  const legendBar = document.getElementById('legend-bar');
  const detailDrawer = document.getElementById('detail-drawer');
  const drawerCategory = document.getElementById('drawer-category');
  const drawerTitle = document.getElementById('drawer-title');
  const drawerDesc = document.getElementById('drawer-desc');
  const drawerYtLink = document.getElementById('drawer-yt-link');
  const btnCloseDrawer = document.getElementById('btn-close-drawer');

  // Handle tap on nodes
  network.on('click', (params) => {
    if(params.nodes.length > 0){
      const nodeId = params.nodes[0];
      const item = nodes.get(nodeId);
      
      if(item){
        drawerCategory.textContent = item.category || 'Technique Detail';
        drawerTitle.textContent = item.label;
        drawerDesc.textContent = item.desc || 'Tactical position or submission.';
        drawerYtLink.href = item.yt || `https://www.youtube.com/results?search_query=bjj+${encodeURIComponent(item.label)}`;
        
        legendBar.classList.add('hidden');
        detailDrawer.classList.remove('hidden');
      }
    }
  });

  btnCloseDrawer.addEventListener('click', () => {
    detailDrawer.classList.add('hidden');
    legendBar.classList.remove('hidden');
  });

  // Search logic
  const searchInput = document.getElementById('search-nodes');
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    if(!term){
      network.fit({ animation: { duration: 400 } });
      return;
    }

    const matches = nodes.get().filter(n => n.label.toLowerCase().includes(term));
    if(matches.length > 0){
      network.focus(matches[0].id, { scale: 1.2, animation: { duration: 300 } });
    }
  });

  document.getElementById('btn-reset-view').addEventListener('click', () => {
    searchInput.value = '';
    detailDrawer.classList.add('hidden');
    legendBar.classList.remove('hidden');
    network.fit({ animation: { duration: 400 } });
  });

})();
</script>
</body>
</html>
