<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BJJ Flow Map — I SEE YOU & YOU ARE PERFECT</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I SEE YOU">
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
  html, body { background:#000; overflow: hidden; height: 100%; width: 100%; }
  
  #network-container {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #111113 0%, #000000 100%);
  }

  .control-pill {
    background: rgba(10, 10, 11, 0.95);
    backdrop-filter: blur(12px);
    border: 1px solid #27272a;
  }

  .btn-primary { background:#dc2626; box-shadow: 0 0 16px rgba(220,38,38,0.35); transition: all .18s ease; }
  .btn-primary:hover { background:#ef4444; box-shadow: 0 0 24px rgba(220,38,38,0.55); }
</style>
</head>
<body class="bg-black text-zinc-100 h-screen flex flex-col justify-between">

<!-- Max Width Shell aligned with your Mobile App Layout -->
<div class="max-w-md mx-auto w-full h-full flex flex-col relative border-x border-zinc-900 overflow-hidden">

  <!-- Header -->
  <div class="z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3 shrink-0">
    <a href="training-log.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="flex-1">
      <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Tactical System</p>
      <h2 class="font-black italic uppercase text-base leading-tight">Top / Bottom Stack</h2>
    </div>
    <img src="logo-bird-only-v2.png" alt="I See You & You Are Perfect" class="h-8 w-auto shrink-0">
  </div>

  <!-- Canvas Container -->
  <div class="relative flex-1 w-full overflow-hidden">
    
    <!-- Floating Search Bar -->
    <div class="absolute top-3 left-3 right-3 z-20">
      <div class="control-pill rounded-xl p-2 shadow-2xl flex items-center gap-2">
        <svg class="w-4 h-4 text-zinc-500 ml-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input 
          id="search-nodes" 
          type="text" 
          placeholder="Search top/bottom technique..." 
          class="w-full bg-transparent text-xs font-medium text-zinc-100 placeholder-zinc-500 focus:outline-none"
        />
        <button id="btn-reset-view" class="text-[10px] font-bold text-red-500 hover:text-red-400 uppercase tracking-wider px-2 py-1 rounded transition shrink-0">
          Reset
        </button>
      </div>
    </div>

    <!-- Vis Network Canvas -->
    <div id="network-container"></div>

    <!-- Floating Legend (Default Bottom) -->
    <div id="legend-bar" class="absolute bottom-3 left-3 right-3 z-20">
      <div class="control-pill rounded-xl p-3 flex items-center justify-around text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-zinc-300">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-red-600 border border-red-400 text-white flex items-center justify-center text-[7px] font-black">1</span> Position
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-zinc-800 border border-zinc-600 text-white flex items-center justify-center text-[7px] font-black">2</span> Top/Bottom
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-white text-black flex items-center justify-center text-[7px] font-black">3</span> Attack/Pass
        </div>
      </div>
    </div>

    <!-- Mobile Pop-Up Drawer (Responsive for S25 & Tall Viewports) -->
    <div id="detail-drawer" class="hidden absolute bottom-3 left-3 right-3 z-30 transition-all max-h-[82vh] overflow-y-auto rounded-2xl">
      <div class="control-pill rounded-2xl p-4 shadow-2xl relative border border-zinc-800 flex flex-col">
        
        <button id="btn-close-drawer" class="absolute top-3 right-3 text-zinc-400 hover:text-white p-1.5 bg-zinc-900/80 rounded-full">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>

        <p id="drawer-category" class="text-[9px] text-red-500 font-extrabold uppercase tracking-[0.2em] mb-1">Technique Detail</p>
        <h3 id="drawer-title" class="text-base font-black italic uppercase text-white pr-6 mb-2 leading-tight"></h3>
        
        <div class="bg-black/60 rounded-xl p-3 border border-zinc-800/80 mb-3">
          <p class="text-[9px] font-black uppercase tracking-widest text-zinc-500 mb-1">Concept</p>
          <p id="drawer-desc" class="text-xs text-zinc-200 leading-relaxed font-medium"></p>
        </div>

        <a id="drawer-yt-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary flex items-center justify-center gap-2 w-full py-3 rounded-xl text-white font-black italic uppercase text-xs tracking-wide shrink-0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          Watch Tutorial Video →
        </a>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const stylePrimary = {
    shape: 'box',
    margin: 12,
    color: { background: '#dc2626', border: '#f87171' },
    font: { color: '#ffffff', face: 'Inter', weight: '900', size: 13 },
    shapeProperties: { borderRadius: 8 }
  };

  const styleSubRole = {
    shape: 'box',
    margin: 10,
    color: { background: '#18181b', border: '#3f3f46' },
    font: { color: '#f4f4f5', face: 'Inter', weight: '800', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  const styleTransition = {
    shape: 'box',
    margin: 10,
    color: { background: '#ffffff', border: '#e4e4e7' },
    font: { color: '#000000', face: 'Inter', weight: '800', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  const styleSubmission = {
    shape: 'box',
    margin: 10,
    color: { background: '#dc2626', border: '#7f1d1d' },
    font: { color: '#000000', face: 'Inter', weight: '900', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  const nodes = new vis.DataSet([
    // 1. OPEN GUARD
    { id: 'og', label: '1. OPEN GUARD', level: 0, category: 'Primary Position', desc: 'Distance management position with dynamic grips and leg frame engagement.', yt: 'https://www.youtube.com/results?search_query=bjj+open+guard+concepts', ...stylePrimary },
    { id: 'og_top', label: 'TOP (Passing / Standing)', level: 1, category: 'Guard Passing', desc: 'Top passer objectives: maintain posture, strip foot grips, pass around or over legs.', yt: 'https://www.youtube.com/results?search_query=bjj+open+guard+passing+concepts', ...styleSubRole },
    { id: 'og_bot', label: 'BOTTOM (Guard Playing)', level: 1, category: 'Guard Playing', desc: 'Bottom guard player objectives: retain guard, off balance (Kuzushi), setup sweeps or leg entry.', yt: 'https://www.youtube.com/results?search_query=bjj+open+guard+retention+and+sweeps', ...styleSubRole },
    { id: 'og_top_torreando', label: 'Torreando / Bullfighter Pass', level: 2, category: 'Top Pass', desc: 'Grip leg cuffs, redirect legs side-to-side, step past guard.', yt: 'https://www.youtube.com/results?search_query=bjj+torreando+pass', ...styleTransition },
    { id: 'og_top_kneecut', label: 'Knee Cut / Slice Pass', level: 2, category: 'Top Pass', desc: 'Drive knee across thigh, underhook far side arm, slide hip to mat.', yt: 'https://www.youtube.com/results?search_query=bjj+knee+cut+pass', ...styleTransition },
    { id: 'og_bot_dlr', label: 'De La Riva Guard', level: 2, category: 'Bottom Guard', desc: 'Hook leg around opponent lead ankle with collar and sleeve grip.', yt: 'https://www.youtube.com/results?search_query=bjj+de+la+riva+guard', ...styleTransition },
    { id: 'og_bot_spider', label: 'Spider Guard', level: 2, category: 'Bottom Guard', desc: 'Place feet on biceps while keeping double sleeve tension.', yt: 'https://www.youtube.com/results?search_query=bjj+spider+guard', ...styleTransition },
    { id: 'og_bot_slx', label: 'Single Leg X-Guard', level: 2, category: 'Bottom Guard', desc: 'Pinch isolated leg with foot on hip to off balance (Kuzushi) or enter leg locks.', yt: 'https://www.youtube.com/results?search_query=bjj+single+leg+x+guard', ...styleTransition },
    { id: 'og_bot_tripod', label: 'Tripod Sweep', level: 2, category: 'Bottom Sweep', desc: 'Foot on hip, hook behind knee, pull sleeve to drop passer.', yt: 'https://www.youtube.com/results?search_query=bjj+tripod+sweep', ...styleTransition },

    // 2. CLOSED GUARD
    { id: 'cg', label: '2. CLOSED GUARD', level: 3, category: 'Primary Position', desc: 'Legs wrapped locked around opponent torso with posture control.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+fundamentals', ...stylePrimary },
    { id: 'cg_top', label: 'TOP (Inside Guard)', level: 4, category: 'Top Defense', desc: 'Inside player objectives: posture up, keep elbows tight, break ankle lock.', yt: 'https://www.youtube.com/results?search_query=bjj+how+to+break+closed+guard', ...styleSubRole },
    { id: 'cg_bot', label: 'BOTTOM (Guard Controller)', level: 4, category: 'Bottom Offense', desc: 'Bottom player objectives: break posture down, attack arms, necks, or sweep.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+attacks', ...styleSubRole },
    { id: 'cg_top_standingbreak', label: 'Standing Guard Break', level: 5, category: 'Top Break', desc: 'Stand up with sleeve control, push knee down to pop ankles open.', yt: 'https://www.youtube.com/results?search_query=bjj+standing+closed+guard+break', ...styleTransition },
    { id: 'cg_top_saucepan', label: 'Log Saw / Elbow Break', level: 5, category: 'Top Break', desc: 'Pin hip, wedge knee into tailbone, push inner thigh.', yt: 'https://www.youtube.com/results?search_query=bjj+seated+closed+guard+break', ...styleTransition },
    { id: 'cg_bot_armbar', label: 'Armbar', level: 5, category: 'Bottom Submission', desc: 'Pivot 90 degrees across chest, clamp legs over back, extend hips.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+armbar', ...styleSubmission },
    { id: 'cg_bot_triangle', label: 'Triangle Choke', level: 5, category: 'Bottom Submission', desc: 'Isolate one arm in/one arm out, clamp shin behind neck.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+triangle+choke', ...styleSubmission },
    { id: 'cg_bot_kimura', label: 'Kimura', level: 5, category: 'Bottom Submission', desc: 'Break wrist grip, sit up over shoulder, double wrist lock.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+kimura', ...styleSubmission },
    { id: 'cg_bot_omoplata', label: 'Omoplata', level: 5, category: 'Bottom Submission', desc: 'Swing leg over shoulder, lock arm with hips, drive forward.', yt: 'https://www.youtube.com/results?search_query=bjj+closed+guard+omoplata', ...styleSubmission },
    { id: 'cg_bot_hipheist', label: 'Hip Heist / Flower Sweep', level: 5, category: 'Bottom Sweep', desc: 'Off balance (Kuzushi) top player, kick leg to sweep them over.', yt: 'https://www.youtube.com/results?search_query=bjj+flower+sweep', ...styleTransition },

    // 3. SIDE CONTROL
    { id: 'sc', label: '3. SIDE CONTROL', level: 6, category: 'Primary Position', desc: 'Chest-to-chest pin perpendicular across opponent.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+pressure', ...stylePrimary },
    { id: 'sc_top', label: 'TOP (Dominant Pin)', level: 7, category: 'Top Offense', desc: 'Top objectives: cross-face pressure, prevent guard recovery, isolate limbs.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+attacks', ...styleSubRole },
    { id: 'sc_bot', label: 'BOTTOM (Pinned Defender)', level: 7, category: 'Bottom Defense', desc: 'Bottom objectives: construct frames, bridge/shrimp, slide knees inside to recover.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+escapes', ...styleSubRole },
    { id: 'sc_top_papercutter', label: 'Paper Cutter Choke', level: 8, category: 'Top Submission', desc: 'Deep lapel grip with elbow driving down past chest/throat.', yt: 'https://www.youtube.com/results?search_query=bjj+paper+cutter+choke', ...styleSubmission },
    { id: 'sc_top_armtriangle', label: 'Arm Triangle (Head & Arm)', level: 8, category: 'Top Submission', desc: 'Trap opponent far arm across neck, dismount side, compress.', yt: 'https://www.youtube.com/results?search_query=bjj+arm+triangle+from+side+control', ...styleSubmission },
    { id: 'sc_top_kimuratrap', label: 'Kimura Trap', level: 8, category: 'Top Transition', desc: 'Figure-four grip on near arm to attack or transition to back.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+kimura+trap', ...styleTransition },
    { id: 'sc_bot_shrimp', label: 'Shrimp Guard Recovery', level: 8, category: 'Bottom Escape', desc: 'Frame on neck/hip, bridge, hip-escape to slip bottom knee inside.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+shrimp+escape', ...styleTransition },
    { id: 'sc_bot_underhook', label: 'Underhook to Dogbar / Single', level: 8, category: 'Bottom Escape', desc: 'Get deep underhook, turn to knees, double leg or take back.', yt: 'https://www.youtube.com/results?search_query=bjj+side+control+underhook+escape', ...styleTransition },

    // 4. MOUNT
    { id: 'm', label: '4. MOUNT', level: 9, category: 'Primary Position', desc: 'Seated directly on top of opponent torso facing their head.', yt: 'https://www.youtube.com/results?search_query=bjj+mount+control', ...stylePrimary },
    { id: 'm_top', label: 'TOP (Mount Attacker)', level: 10, category: 'Top Offense', desc: 'Top objectives: stay heavy, walk elbows up above head, set up submissions.', yt: 'https://www.youtube.com/results?search_query=bjj+mount+attacks+system', ...styleSubRole },
    { id: 'm_bot', label: 'BOTTOM (Mounted Defender)', level: 10, category: 'Bottom Defense', desc: 'Bottom objectives: protect neck/arms, bridge-and-roll or elbow-escape.', yt: 'https://www.youtube.com/results?search_query=bjj+mount+escapes', ...styleSubRole },
    { id: 'm_top_smountarmbar', label: 'S-Mount Armbar', level: 11, category: 'Top Submission', desc: 'Slide knees high into S-shape, isolate far arm, swing leg over.', yt: 'https://www.youtube.com/results?search_query=bjj+s+mount+armbar', ...styleSubmission },
    { id: 'm_top_crosscollar', label: 'Cross Collar Choke', level: 11, category: 'Top Submission', desc: 'Deep four-finger collar grip, cross second hand under, drop head.', yt: 'https://www.youtube.com/results?search_query=bjj+mounted+cross+collar+choke', ...styleSubmission },
    { id: 'm_top_ezekiel', label: 'Ezekiel Choke', level: 11, category: 'Top Submission', desc: 'Sleeve cuff grip behind head, chop fist into throat.', yt: 'https://www.youtube.com/results?search_query=bjj+mounted+ezekiel+choke', ...styleSubmission },
    { id: 'm_bot_elbowescape', label: 'Elbow-Knee Escape', level: 11, category: 'Bottom Escape', desc: 'Turn sideways, slide elbow down leg to catch foot into half guard.', yt: 'https://www.youtube.com/results?search_query=bjj+mount+elbow+knee+escape', ...styleTransition },
    { id: 'm_bot_upa', label: 'Upa / Bridge & Roll Escape', level: 11, category: 'Bottom Escape', desc: 'Trap overhook arm and same-side ankle, bridge high to roll.', yt: 'https://www.youtube.com/results?search_query=bjj+upa+escape+mount', ...styleTransition },

    // 5. BACK CONTROL
    { id: 'bc', label: '5. BACK CONTROL', level: 12, category: 'Primary Position', desc: 'Rear body lock with seatbelt grip, hooks, or body triangle.', yt: 'https://www.youtube.com/results?search_query=bjj+back+control+system', ...stylePrimary },
    { id: 'bc_top', label: 'TOP / REAR ATTACKER', level: 13, category: 'Rear Offense', desc: 'Attacker objectives: control opponent head line, trap defending hands, finish choke.', yt: 'https://www.youtube.com/results?search_query=bjj+back+attacks+system', ...styleSubRole },
    { id: 'bc_bot', label: 'BOTTOM / DEFENDER', level: 13, category: 'Rear Defense', desc: 'Defender objectives: defend choke neck line, clear hooks, slide shoulders to mat.', yt: 'https://www.youtube.com/results?search_query=bjj+back+control+escapes', ...styleSubRole },
    { id: 'bc_top_rnc', label: 'Rear Naked Choke (RNC)', level: 14, category: 'Rear Submission', desc: 'Biceps-to-biceps grip, lock behind head, expand chest to finish.', yt: 'https://www.youtube.com/results?search_query=bjj+rear+naked+choke+finish', ...styleSubmission },
    { id: 'bc_top_bowandarrow', label: 'Bow & Arrow Choke', level: 14, category: 'Rear Submission', desc: 'Deep collar grip, grab pant cuff, rotate perpendicular and extend.', yt: 'https://www.youtube.com/results?search_query=bjj+bow+and+arrow+choke', ...styleSubmission },
    { id: 'bc_top_straightjacket', label: 'Straight Jacket Trap', level: 14, category: 'Rear Attack', desc: 'Use leg hook to trap defender wrist, isolating neck for easy choke.', yt: 'https://www.youtube.com/results?search_query=bjj+straight+jacket+back+system', ...styleTransition },
    { id: 'bc_bot_scapulaescape', label: 'Shoulder-to-Mat Escape', level: 14, category: 'Rear Escape', desc: 'Fight choke hand, slide hips off side, drive shoulders down to mat.', yt: 'https://www.youtube.com/results?search_query=bjj+back+control+escape+shoulders+to+mat', ...styleTransition }
  ]);

  const edges = new vis.DataSet([
    { from: 'og', to: 'og_top' },
    { from: 'og', to: 'og_bot' },
    { from: 'og_top', to: 'og_top_torreando' },
    { from: 'og_top', to: 'og_top_kneecut' },
    { from: 'og_bot', to: 'og_bot_dlr' },
    { from: 'og_bot', to: 'og_bot_spider' },
    { from: 'og_bot', to: 'og_bot_slx' },
    { from: 'og_bot', to: 'og_bot_tripod' },
    { from: 'cg', to: 'cg_top' },
    { from: 'cg', to: 'cg_bot' },
    { from: 'cg_top', to: 'cg_top_standingbreak' },
    { from: 'cg_top', to: 'cg_top_saucepan' },
    { from: 'cg_bot', to: 'cg_bot_armbar' },
    { from: 'cg_bot', to: 'cg_bot_triangle' },
    { from: 'cg_bot', to: 'cg_bot_kimura' },
    { from: 'cg_bot', to: 'cg_bot_omoplata' },
    { from: 'cg_bot', to: 'cg_bot_hipheist' },
    { from: 'sc', to: 'sc_top' },
    { from: 'sc', to: 'sc_bot' },
    { from: 'sc_top', to: 'sc_top_papercutter' },
    { from: 'sc_top', to: 'sc_top_armtriangle' },
    { from: 'sc_top', to: 'sc_top_kimuratrap' },
    { from: 'sc_bot', to: 'sc_bot_shrimp' },
    { from: 'sc_bot', to: 'sc_bot_underhook' },
    { from: 'm', to: 'm_top' },
    { from: 'm', to: 'm_bot' },
    { from: 'm_top', to: 'm_top_smountarmbar' },
    { from: 'm_top', to: 'm_top_crosscollar' },
    { from: 'm_top', to: 'm_top_ezekiel' },
    { from: 'm_bot', to: 'm_bot_elbowescape' },
    { from: 'm_bot', to: 'm_bot_upa' },
    { from: 'bc', to: 'bc_top' },
    { from: 'bc', to: 'bc_bot' },
    { from: 'bc_top', to: 'bc_top_rnc' },
    { from: 'bc_top', to: 'bc_top_bowandarrow' },
    { from: 'bc_top', to: 'bc_top_straightjacket' },
    { from: 'bc_bot', to: 'bc_bot_scapulaescape' }
  ]);

  const container = document.getElementById('network-container');
  const data = { nodes: nodes, edges: edges };

  const options = {
    layout: {
      hierarchical: {
        enabled: true,
        direction: 'UD',
        sortMethod: 'directed',
        nodeSpacing: 100,
        levelSeparation: 90
      }
    },
    physics: { enabled: false },
    edges: {
      arrows: { to: { enabled: true, scaleFactor: 0.5 } },
      color: { color: '#dc2626', highlight: '#ef4444' },
      width: 1.5,
      smooth: { type: 'cubicBezier', forceDirection: 'vertical' }
    },
    interaction: { hover: true, zoomView: true, dragView: true }
  };

  const network = new vis.Network(container, data, options);

  // Drawer elements
  const legendBar = document.getElementById('legend-bar');
  const detailDrawer = document.getElementById('detail-drawer');
  const drawerCategory = document.getElementById('drawer-category');
  const drawerTitle = document.getElementById('drawer-title');
  const drawerDesc = document.getElementById('drawer-desc');
  const drawerYtLink = document.getElementById('drawer-yt-link');
  const btnCloseDrawer = document.getElementById('btn-close-drawer');

  // Handle tap on nodes
  network.on('click', (params) => {
    if(params.nodes.length > 0){
      const nodeId = params.nodes[0];
      const item = nodes.get(nodeId);
      
      if(item){
        drawerCategory.textContent = item.category || 'Technique Detail';
        drawerTitle.textContent = item.label;
        drawerDesc.textContent = item.desc || 'Tactical position or submission.';
        drawerYtLink.href = item.yt || `https://www.youtube.com/results?search_query=bjj+${encodeURIComponent(item.label)}`;
        
        legendBar.classList.add('hidden');
        detailDrawer.classList.remove('hidden');
      }
    }
  });

  btnCloseDrawer.addEventListener('click', () => {
    detailDrawer.classList.add('hidden');
    legendBar.classList.remove('hidden');
  });

  // Search logic
  const searchInput = document.getElementById('search-nodes');
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    if(!term){
      network.fit({ animation: { duration: 400 } });
      return;
    }

    const matches = nodes.get().filter(n => n.label.toLowerCase().includes(term));
    if(matches.length > 0){
      network.focus(matches[0].id, { scale: 1.2, animation: { duration: 300 } });
    }
  });

  document.getElementById('btn-reset-view').addEventListener('click', () => {
    searchInput.value = '';
    detailDrawer.classList.add('hidden');
    legendBar.classList.remove('hidden');
    network.fit({ animation: { duration: 400 } });
  });

})();
</script>
</body>
</html>
