<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BJJ Flow Map — I SEE YOU & YOU ARE PERFECT</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I SEE YOU">
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  html, body { background:#000; overflow: hidden; }
  
  #network-container {
    width: 100%;
    height: calc(100vh - 73px);
    background: radial-gradient(circle at center, #111113 0%, #000000 100%);
  }

  .control-pill {
    background: rgba(10, 10, 11, 0.90);
    backdrop-filter: blur(10px);
    border: 1px solid #18181b;
  }
</style>
</head>
<body class="bg-black text-zinc-100">
<div class="max-w-md mx-auto h-screen bg-black flex flex-col relative border-x border-zinc-900">

  <!-- Sticky Top Bar -->
  <div class="sticky top-0 z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3">
    <a href="training-log.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="flex-1">
      <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Tactical System</p>
      <h2 class="font-black italic uppercase text-base leading-tight">Technique Hierarchy Map</h2>
    </div>
    <img src="logo-bird-only-v2.png" alt="I See You & You Are Perfect" class="h-8 w-auto shrink-0">
  </div>

  <!-- Flow Area -->
  <div class="relative flex-1">
    
    <!-- Floating Search Bar -->
    <div class="absolute top-4 left-4 right-4 z-20">
      <div class="control-pill rounded-xl p-2 shadow-2xl flex items-center gap-2">
        <svg class="w-4 h-4 text-zinc-500 ml-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input 
          id="search-nodes" 
          type="text" 
          placeholder="Search position or submission..." 
          class="w-full bg-transparent text-xs font-medium text-zinc-100 placeholder-zinc-500 focus:outline-none"
        />
        <button id="btn-reset-view" class="text-[10px] font-bold text-red-500 hover:text-red-400 uppercase tracking-wider px-2 py-1 rounded transition">
          Reset
        </button>
      </div>
    </div>

    <!-- Canvas -->
    <div id="network-container"></div>

    <!-- Floating Legend -->
    <div class="absolute bottom-4 left-4 right-4 z-20">
      <div class="control-pill rounded-xl p-3 flex items-center justify-around text-[10px] font-bold uppercase tracking-wider text-zinc-300">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-red-600 border border-red-400 text-white flex items-center justify-center text-[7px] font-black">1</span> Primary Position
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-white text-black flex items-center justify-center text-[7px] font-black">2</span> Transition / Pass
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-red-600 text-black flex items-center justify-center text-[7px] font-black">3</span> Submission
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  // Reusable node styling definitions
  const stylePrimary = {
    shape: 'box',
    margin: 12,
    color: { background: '#dc2626', border: '#f87171' },
    font: { color: '#ffffff', face: 'Inter', weight: '900', size: 12 },
    shapeProperties: { borderRadius: 8 }
  };

  const styleTransition = {
    shape: 'box',
    margin: 10,
    color: { background: '#ffffff', border: '#e4e4e7' },
    font: { color: '#000000', face: 'Inter', weight: '800', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  const styleSubmission = {
    shape: 'box',
    margin: 10,
    color: { background: '#dc2626', border: '#7f1d1d' },
    font: { color: '#000000', face: 'Inter', weight: '900', size: 11 },
    shapeProperties: { borderRadius: 6 }
  };

  // Hierarchy Structure
  const nodes = new vis.DataSet([
    // Level 1: Core Positions
    { id: 'cg', label: 'CLOSED GUARD', level: 0, ...stylePrimary },
    { id: 'og', label: 'OPEN GUARD', level: 0, ...stylePrimary },
    { id: 'sc', label: 'SIDE CONTROL', level: 0, ...stylePrimary },
    { id: 'm',  label: 'MOUNT', level: 0, ...stylePrimary },
    { id: 'bc', label: 'BACK CONTROL', level: 0, ...stylePrimary },

    // Level 2: Closed Guard Breakdown
    { id: 'cg_armbar', label: 'Armbar', level: 1, ...styleSubmission },
    { id: 'cg_triangle', label: 'Triangle Choke', level: 1, ...styleSubmission },
    { id: 'cg_kimura', label: 'Kimura', level: 1, ...styleSubmission },
    { id: 'cg_sweep', label: 'Hip Heist Sweep', level: 1, ...styleTransition },

    // Level 2: Open Guard Breakdown
    { id: 'og_dlr', label: 'De La Riva Guard', level: 1, ...styleTransition },
    { id: 'og_spider', label: 'Spider Guard', level: 1, ...styleTransition },
    { id: 'og_tripod', label: 'Tripod Sweep', level: 1, ...styleTransition },

    // Level 2: Side Control Breakdown
    { id: 'sc_kimuratrap', label: 'Kimura Trap', level: 1, ...styleTransition },
    { id: 'sc_papercutter', label: 'Paper Cutter Choke', level: 1, ...styleSubmission },
    { id: 'sc_armtriangle', label: 'Arm Triangle', level: 1, ...styleSubmission },

    // Level 2: Mount Breakdown
    { id: 'm_armbar', label: 'S-Mount Armbar', level: 1, ...styleSubmission },
    { id: 'm_collar', label: 'Cross Collar Choke', level: 1, ...styleSubmission },
    { id: 'm_backtake', label: 'Gift Wrap Back Take', level: 1, ...styleTransition },

    // Level 2: Back Control Breakdown
    { id: 'bc_rnc', label: 'Rear Naked Choke', level: 1, ...styleSubmission },
    { id: 'bc_bow', label: 'Bow & Arrow Choke', level: 1, ...styleSubmission },
    { id: 'bc_armbar', label: 'Back Armbar', level: 1, ...styleSubmission }
  ]);

  // Directed Connections from Parent Positions down to Breakdowns
  const edges = new vis.DataSet([
    // Closed Guard branches
    { from: 'cg', to: 'cg_armbar' },
    { from: 'cg', to: 'cg_triangle' },
    { from: 'cg', to: 'cg_kimura' },
    { from: 'cg', to: 'cg_sweep' },

    // Open Guard branches
    { from: 'og', to: 'og_dlr' },
    { from: 'og', to: 'og_spider' },
    { from: 'og', to: 'og_tripod' },

    // Side Control branches
    { from: 'sc', to: 'sc_kimuratrap' },
    { from: 'sc', to: 'sc_papercutter' },
    { from: 'sc', to: 'sc_armtriangle' },

    // Mount branches
    { from: 'm', to: 'm_armbar' },
    { from: 'm', to: 'm_collar' },
    { from: 'm', to: 'm_backtake' },

    // Back Control branches
    { from: 'bc', to: 'bc_rnc' },
    { from: 'bc', to: 'bc_bow' },
    { from: 'bc', to: 'bc_armbar' }
  ]);

  const container = document.getElementById('network-container');
  const data = { nodes: nodes, edges: edges };

  const options = {
    layout: {
      hierarchical: {
        enabled: true,
        direction: 'UD', // Top-Down layout
        sortMethod: 'directed',
        nodeSpacing: 140,
        levelSeparation: 120
      }
    },
    physics: {
      enabled: false // Disables floating physics entirely
    },
    edges: {
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      color: { color: '#dc2626', highlight: '#ef4444' },
      width: 1.5,
      smooth: { type: 'cubicBezier', forceDirection: 'vertical' }
    },
    interaction: {
      hover: true,
      zoomView: true,
      dragView: true
    }
  };

  const network = new vis.Network(container, data, options);

  // Search logic
  const searchInput = document.getElementById('search-nodes');
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    if(!term){
      network.fit({ animation: { duration: 400 } });
      return;
    }

    const matches = nodes.get().filter(n => n.label.toLowerCase().includes(term));
    if(matches.length > 0){
      network.focus(matches[0].id, { scale: 1.2, animation: { duration: 300 } });
    }
  });

  document.getElementById('btn-reset-view').addEventListener('click', () => {
    searchInput.value = '';
    network.fit({ animation: { duration: 400 } });
  });

})();
</script>
</body>
</html>
