<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BJJ Flow Map — I SEE YOU & YOU ARE PERFECT</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I SEE YOU">
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  html, body { background:#000; overflow: hidden; }
  .card { background:#0a0a0b; border:1px solid #18181b; }
  .input-field { background:#0a0a0b; border:1px solid #27272a; color:#fafafa; transition: all .2s ease; }
  .input-field:focus { outline: none; border-color:#dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.18), 0 0 18px rgba(220,38,38,0.25); }
  .input-field::placeholder { color:#52525b; }
  
  #network-container {
    width: 100%;
    height: calc(100vh - 73px);
    background: radial-gradient(circle at center, #111113 0%, #000000 100%);
  }

  .control-pill {
    background: rgba(10, 10, 11, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid #18181b;
  }
</style>
</head>
<body class="bg-black text-zinc-100">
<div class="max-w-md mx-auto h-screen bg-black flex flex-col relative border-x border-zinc-900">

  <!-- Header -->
  <div class="sticky top-0 z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3">
    <a href="training-log.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="flex-1">
      <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Tactical System</p>
      <h2 class="font-black italic uppercase text-base leading-tight">Technique Flow Map</h2>
    </div>
    <img src="logo-bird-only-v2.png" alt="I See You & You Are Perfect" class="h-8 w-auto shrink-0">
  </div>

  <!-- Main Mindmap Container -->
  <div class="relative flex-1">
    
    <!-- Floating Search Bar -->
    <div class="absolute top-4 left-4 right-4 z-20">
      <div class="control-pill rounded-xl p-2 shadow-2xl flex items-center gap-2">
        <svg class="w-4 h-4 text-zinc-500 ml-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input 
          id="search-nodes" 
          type="text" 
          placeholder="Search position or submission..." 
          class="w-full bg-transparent text-xs font-medium text-zinc-100 placeholder-zinc-500 focus:outline-none"
        />
        <button id="btn-reset-view" class="text-[10px] font-bold text-red-500 hover:text-red-400 uppercase tracking-wider px-2 py-1 rounded transition">
          Reset
        </button>
      </div>
    </div>

    <!-- Canvas -->
    <div id="network-container"></div>

    <!-- Floating Legend Bar -->
    <div class="absolute bottom-4 left-4 right-4 z-20">
      <div class="control-pill rounded-xl p-3 flex items-center justify-around text-[10px] font-bold uppercase tracking-wider text-zinc-300">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-red-600 border border-white flex items-center justify-center text-[7px] text-white font-black">A</span> Primary Position
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-white text-black flex items-center justify-center text-[7px] font-black">B</span> Transition / Pass
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-red-600 text-black flex items-center justify-center text-[7px] font-black">C</span> Submission
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  // Reusable node styles according to requested spec
  const stylePrimary = {
    shape: 'ellipse',
    color: { background: '#dc2626', border: '#ef4444' },
    font: { color: '#ffffff', face: 'Inter', weight: '900', size: 13 }
  };

  const styleSubmission = {
    shape: 'ellipse',
    color: { background: '#dc2626', border: '#b91c1c' },
    font: { color: '#000000', face: 'Inter', weight: '900', size: 12 }
  };

  const styleTransition = {
    shape: 'box',
    color: { background: '#ffffff', border: '#e4e4e7' },
    font: { color: '#000000', face: 'Inter', weight: '800', size: 11 }
  };

  const nodes = new vis.DataSet([
    // Primary Positions (Red BG + White Text)
    { id: 1, label: 'CLOSED GUARD', ...stylePrimary },
    { id: 2, label: 'OPEN GUARD', ...stylePrimary },
    { id: 3, label: 'SIDE CONTROL', ...stylePrimary },
    { id: 4, label: 'MOUNT', ...stylePrimary },
    { id: 5, label: 'BACK CONTROL', ...stylePrimary },
    
    // Transitions & Passes (White Box + Black Text)
    { id: 6, label: 'De La Riva Guard', ...styleTransition },
    { id: 7, label: 'Kimura Trap', ...styleTransition },
    
    // Submissions (Red BG + Black Text)
    { id: 8, label: 'Armbar', ...styleSubmission },
    { id: 9, label: 'Triangle Choke', ...styleSubmission },
    { id: 10, label: 'Rear Naked Choke', ...styleSubmission },
    { id: 11, label: 'Cross Collar Choke', ...styleSubmission }
  ]);

  const edges = new vis.DataSet([
    { from: 1, to: 8, arrows: 'to', color: { color: '#dc2626' } },
    { from: 1, to: 9, arrows: 'to', color: { color: '#dc2626' } },
    { from: 1, to: 2, arrows: 'to', color: { color: '#ffffff' } },
    { from: 2, to: 6, arrows: 'to', color: { color: '#ffffff' } },
    { from: 6, to: 3, arrows: 'to', color: { color: '#ffffff' } },
    { from: 3, to: 4, arrows: 'to', color: { color: '#ffffff' } },
    { from: 3, to: 7, arrows: 'to', color: { color: '#ffffff' } },
    { from: 7, to: 5, arrows: 'to', color: { color: '#dc2626' } },
    { from: 4, to: 11, arrows: 'to', color: { color: '#dc2626' } },
    { from: 5, to: 10, arrows: 'to', color: { color: '#dc2626' } }
  ]);

  const container = document.getElementById('network-container');
  const data = { nodes: nodes, edges: edges };
  
  const options = {
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -40,
        centralGravity: 0.01,
        springLength: 110,
        springConstant: 0.08
      }
    },
    interaction: {
      hover: true,
      zoomView: true,
      dragView: true
    }
  };

  const network = new vis.Network(container, data, options);

  const searchInput = document.getElementById('search-nodes');
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    if(!term){
      network.fit({ animation: { duration: 500 } });
      return;
    }

    const matches = nodes.get().filter(n => n.label.toLowerCase().includes(term));
    if(matches.length > 0){
      network.focus(matches[0].id, { scale: 1.2, animation: { duration: 400 } });
    }
  });

  document.getElementById('btn-reset-view').addEventListener('click', () => {
    searchInput.value = '';
    network.fit({ animation: { duration: 500 } });
  });

})();
</script>
</body>
</html>
