    { id: 'bc_top', label: 'TOP / REAR ATTACKER', x: -200, y: 1500, category: 'Rear Offense', phases: [{ title: 'Process', text: 'Control chest-to-back connection, trap defending hand inside legs, and isolate chin line.' }], ytBase: 'bjj back attacks system', conceptYt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1406s', ...styleSubRole },
    { id: 'bc_bot', label: 'BOTTOM / DEFENDER', x: 200, y: 1500, category: 'Rear Defense', phases: [{ title: 'Process', text: 'Deny choke arm inside space, protect collar grips, and slide shoulders flat to mat.' }], ytBase: 'bjj back control escapes fundamentals', conceptYt: 'https://www.youtube.com/watch?v=9jPMz-UyxDc&t=1730s', ...styleSubRole },
    { id: 'bc_top_rnc', label: 'Rear Naked Choke (RNC)', x: -320, y: 1600, category: 'Rear Submission', phases: [{ title: 'Process', text: 'Slide choking arm deep inside under chin, lock biceps grip behind head, and compress chest.' }], ytBase: 'bjj rear naked choke finish details', ...styleSubmission },
    { id: 'bc_top_bowandarrow', label: 'Bow & Arrow Choke', x: -200, y: 1600, category: 'Rear Submission', phases: [{ title: 'Process', text: 'Grip inside collar, grab far pant cuff, and rotate perpendicular to apply leverage against neck.' }], ytBase: 'bjj bow and arrow choke finish', ...styleSubmission },
    { id: 'bc_top_straightjacket', label: 'Straight Jacket Trap', x: -80, y: 1600, category: 'Rear Attack', phases: [{ title: 'Process', text: 'Use leg hook to trap defender defending hand inside, isolating neck for an undefended choke.' }], ytBase: 'bjj straight jacket back system', ...styleTransition },
    { id: 'bc_bot_scapulaescape', label: 'Shoulder-to-Mat Escape', x: 160, y: 1600, category: 'Rear Escape', phases: [{ title: 'Process', text: 'Control choking wrist, clear top hook, and slide hips sideways to get shoulders flat on the mat.' }], ytBase: 'bjj back control escape shoulders to mat', ...styleTransition }
  ];

  const edgeData = [
    { from: 'og', to: 'og_top' }, { from: 'og', to: 'og_bot' },
    { from: 'og_top', to: 'og_top_torreando' }, { from: 'og_top', to: 'og_top_kneecut' },
    { from: 'og_bot', to: 'og_bot_dlr' }, { from: 'og_bot', to: 'og_bot_spider' }, { from: 'og_bot', to: 'og_bot_slx' }, { from: 'og_bot', to: 'og_bot_tripod' },
    { from: 'cg', to: 'cg_top' }, { from: 'cg', to: 'cg_bot' },
    { from: 'cg_top', to: 'cg_top_standingbreak' }, { from: 'cg_top', to: 'cg_top_saucepan' },
    { from: 'cg_bot', to: 'cg_bot_armbar' }, { from: 'cg_bot', to: 'cg_bot_triangle' }, { from: 'cg_bot', to: 'cg_bot_kimura' }, { from: 'cg_bot', to: 'cg_bot_omoplata' }, { from: 'cg_bot', to: 'cg_bot_hipheist' },
    { from: 'sc', to: 'sc_top' }, { from: 'sc', to: 'sc_bot' },
    { from: 'sc_top', to: 'sc_top_papercutter' }, { from: 'sc_top', to: 'sc_top_armtriangle' }, { from: 'sc_top', to: 'sc_top_kimuratrap' },
    { from: 'sc_bot', to: 'sc_bot_shrimp' }, { from: 'sc_bot', to: 'sc_bot_underhook' },
    { from: 'm', to: 'm_top' }, { from: 'm', to: 'm_bot' },
    { from: 'm_top', to: 'm_top_smountarmbar' }, { from: 'm_top', to: 'm_top_crosscollar' }, { from: 'm_top', to: 'm_top_ezekiel' },
    { from: 'm_bot', to: 'm_bot_elbowescape' }, { from: 'm_bot', to: 'm_bot_upa' },
    { from: 'bc', to: 'bc_top' }, { from: 'bc', to: 'bc_bot' },
    { from: 'bc_top', to: 'bc_top_rnc' }, { from: 'bc_top', to: 'bc_top_bowandarrow' }, { from: 'bc_top', to: 'bc_top_straightjacket' },
    { from: 'bc_bot', to: 'bc_bot_scapulaescape' }
  ];

  const visNodes = new vis.DataSet(nodeData);
  const visEdges = new vis.DataSet(edgeData);
  const container = document.getElementById('network-container');
  const data = { nodes: visNodes, edges: visEdges };

  const options = {
    physics: { enabled: false },
    edges: {
      arrows: { to: { enabled: true, scaleFactor: 0.5 } },
      color: { color: '#dc2626', highlight: '#ef4444' },
      width: 1.5,
      smooth: { type: 'cubicBezier', forceDirection: 'vertical' }
    },
    interaction: { hover: true, zoomView: true, dragView: true }
  };

  const network = new vis.Network(container, data, options);

  // Trace root primary position
  function getPrimaryAncestor(nodeId) {
    let current = nodeId;
    while (current) {
      const item = nodeData.find(function(n){ return n.id === current; });
      if (item && item.category === 'Primary Position') {
        return item.label;
      }
      const parentEdge = edgeData.find(function(e){ return e.to === current; });
      current = parentEdge ? parentEdge.from : null;
    }
    return '';
  }

  // Fetch belt rank & heatmap tracking
  let userBelt = 'White Belt';
  let isAdvancedBelt = false;
  let loggedCounts = {};

  try {
    if(typeof sb !== 'undefined' && sb.auth){
      const res = await sb.auth.getSession();
      if(res && res.data && res.data.session){
        const uid = res.data.session.user.id;

        // Fetch profile
        const { data: prof } = await sb.from('profiles').select('belt_rank').eq('id', uid).single();
        if(prof && prof.belt_rank){
          userBelt = prof.belt_rank;
          isAdvancedBelt = ['Purple Belt', 'Brown Belt', 'Black Belt'].includes(userBelt);
        }

        // Fetch heatmap
        const { data: trainings } = await sb.from('trainings').select('focus').eq('user_id', uid);
        (trainings || []).forEach(function(t){
          if(t.focus){
            const text = t.focus.toLowerCase();
            nodeData.forEach(function(n){
              if(text.includes(n.label.toLowerCase())){
                loggedCounts[n.id] = (loggedCounts[n.id] || 0) + 1;
              }
            });
          }
        });

        Object.keys(loggedCounts).forEach(function(nid){
          const existing = visNodes.get(nid);
          if(existing){
            visNodes.update({ id: nid, borderWidth: 2, color: { border: '#eab308' } });
          }
        });
      }
    }
  } catch(e) { console.warn('Profile/Heatmap offline or guest mode'); }

  // Drawer elements
  const legendBar = document.getElementById('legend-bar');
  const detailDrawer = document.getElementById('detail-drawer');
  const drawerParentPos = document.getElementById('drawer-parent-pos');
  const drawerCategory = document.getElementById('drawer-category');
  const drawerHeatBadge = document.getElementById('drawer-heat-badge');
  const drawerRankBadge = document.getElementById('drawer-rank-badge');
  const drawerTitle = document.getElementById('drawer-title');
  const drawerCoreRuleBox = document.getElementById('drawer-core-rule-box');
  const drawerCoreRule = document.getElementById('drawer-core-rule');
  const drawerPhasesContainer = document.getElementById('drawer-phases-container');
  const drawerYtLink = document.getElementById('drawer-yt-link');
  const drawerConceptYtLink = document.getElementById('drawer-concept-yt-link');
  const drawerLogBtn = document.getElementById('drawer-log-btn');
  const btnCloseDrawer = document.getElementById('btn-close-drawer');

  // Node tap handler
  network.on('click', function(params){
    if(params.nodes.length > 0){
      const nodeId = params.nodes[0];
      const item = visNodes.get(nodeId);
      
      if(item){
        const primaryPosLabel = getPrimaryAncestor(nodeId);
        
        drawerParentPos.textContent = primaryPosLabel ? 'Position: ' + primaryPosLabel : '';
        drawerCategory.textContent = item.category || 'Technique Detail';
        drawerTitle.textContent = item.label;

        // Render Core System Directive
        if (item.coreRule) {
          drawerCoreRule.textContent = item.coreRule;
          drawerCoreRuleBox.classList.remove('hidden');
        } else {
          drawerCoreRuleBox.classList.add('hidden');
        }

        // Render Formatted Phases / Process Cards
        drawerPhasesContainer.innerHTML = '';
        if (item.phases && item.phases.length > 0) {
          item.phases.forEach(p => {
            const card = document.createElement('div');
            card.className = 'bg-black/80 rounded-xl p-3 border border-zinc-800';
            card.innerHTML = `
              <p class="text-[9px] font-black uppercase tracking-widest text-zinc-400 mb-1 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 bg-red-600 rounded-full inline-block"></span> ${p.title}
              </p>
              <p class="text-xs text-zinc-200 leading-relaxed font-medium">${p.text}</p>
            `;
            drawerPhasesContainer.appendChild(card);
          });
        }

        // Dynamic search query depending on Belt Rank
        let searchQuery = item.ytBase || ('bjj ' + item.label);
        if (isAdvancedBelt) {
          searchQuery += ' advanced details counters high level shorts';
          drawerRankBadge.textContent = `⚡ Advanced (${userBelt})`;
          drawerRankBadge.classList.remove('hidden');
        } else {
          searchQuery += ' fundamentals basics tutorial shorts';
          drawerRankBadge.classList.add('hidden');
        }

        drawerYtLink.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(searchQuery);

        // Build concise summary text for training log query param
        const summaryConcept = item.coreRule ? `Core Rule: ${item.coreRule}` : (item.phases && item.phases[0] ? item.phases[0].text : '');
        drawerLogBtn.href = 'training-log.html?focus=' + encodeURIComponent(item.label) + '&concept=' + encodeURIComponent(summaryConcept) + '&primary=' + encodeURIComponent(primaryPosLabel);

        const count = loggedCounts[nodeId] || 0;
        if(count > 0){
          drawerHeatBadge.textContent = '🔥 Logged ' + count + 'x';
          drawerHeatBadge.classList.remove('hidden');
        } else {
          drawerHeatBadge.classList.add('hidden');
        }

        // Deep Dive Concept link
        if (item.conceptYt) {
          drawerConceptYtLink.href = item.conceptYt;
          drawerConceptYtLink.classList.remove('hidden');
        } else {
          drawerConceptYtLink.classList.add('hidden');
        }

        legendBar.classList.add('hidden');
        detailDrawer.classList.remove('hidden');
      }
    }
  });

  btnCloseDrawer.addEventListener('click', function(){
    detailDrawer.classList.add('hidden');
    legendBar.classList.remove('hidden');
  });

  // Search logic
  const searchInput = document.getElementById('search-nodes');
  searchInput.addEventListener('input', function(e){
    const term = e.target.value.toLowerCase().trim();
    if(!term){
      network.fit({ animation: { duration: 400 } });
      return;
    }

    const matches = visNodes.get().filter(function(n){ return n.label.toLowerCase().includes(term); });
    if(matches.length > 0){
      network.focus(matches[0].id, { scale: 1.2, animation: { duration: 300 } });
    }
  });

  document.getElementById('btn-reset-view').addEventListener('click', function(){
    searchInput.value = '';
    detailDrawer.classList.add('hidden');
    legendBar.classList.remove('hidden');
    network.fit({ animation: { duration: 400 } });
  });

})();
</script>
</body>
</html>
