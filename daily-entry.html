<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily Entry — I SEE YOU & YOU ARE PERFECT</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I SEE YOU">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  html, body { background:#000; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000000; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

  .input-field, .textarea-field { background:#0a0a0b; border:1px solid #27272a; color:#fafafa; transition: all .2s ease; }
  .input-field:focus, .textarea-field:focus { outline: none; border-color:#dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.18), 0 0 18px rgba(220,38,38,0.25); }
  .input-field::placeholder, .textarea-field::placeholder { color:#52525b; }

  .btn-primary { background:#dc2626; box-shadow: 0 0 22px rgba(220,38,38,0.35); transition: all .18s ease; }
  .btn-primary:hover { background:#ef4444; box-shadow: 0 0 32px rgba(220,38,38,0.55); }
  .btn-primary:disabled { opacity:.6; }
  .card { background:#0a0a0b; border:1px solid #18181b; }
  .check-box { transition: all .15s ease; }
  .check-box.checked { background:#dc2626; box-shadow: 0 0 10px rgba(220,38,38,0.5); border-color:#dc2626; }

  #loading-overlay { background:#000; }
  .spinner { border: 2.5px solid #27272a; border-top-color:#dc2626; border-radius:50%; width:28px; height:28px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { animation: toastIn .2s ease, toastOut .2s ease 1.8s forwards; }
  @keyframes toastIn { from {opacity:0; transform:translate(-50%,10px);} to {opacity:1; transform:translate(-50%,0);} }
  @keyframes toastOut { to {opacity:0; transform:translate(-50%,10px);} }
</style>
</head>
<body class="bg-black text-zinc-100">
<div class="max-w-md mx-auto min-h-screen bg-black flex flex-col relative border-x border-zinc-900">

  <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="spinner"></div>
  </div>

  <div id="app-content" class="hidden flex-1 flex flex-col">
    <div class="sticky top-0 z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div>
        <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Accountability Journal</p>
        <h2 id="daily-date-title" class="font-black italic uppercase text-base leading-tight"></h2>
      </div>
    </div>

    <div class="flex-1 px-5 py-5 space-y-5 pb-28">
      <!-- Morning Setup -->
      <div class="card rounded-xl p-4">
        <h3 class="font-black italic uppercase text-red-600 text-xs tracking-[0.2em] mb-4 flex items-center gap-2">
          <span class="w-1.5 h-1.5 bg-red-600 rounded-full inline-block"></span> Morning Setup
        </h3>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Daily Affirmation</label>
        <div class="flex items-center gap-2 mb-4">
          <p id="d-affirmation-display" class="flex-1 bg-black border border-zinc-800 rounded-lg px-3.5 py-3 text-sm text-white font-semibold italic"></p>
          <button id="btn-shuffle-affirmation" type="button" title="Get another" class="w-11 h-11 shrink-0 flex items-center justify-center rounded-lg border border-zinc-800 hover:border-red-600 text-zinc-400 hover:text-red-500 transition">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
        </div>
        <input type="hidden" id="d-affirmation">

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Three Things I'm Thankful For</label>
        <div class="space-y-2 mb-4">
          <div class="flex items-center gap-2">
            <span class="text-red-600 font-black italic text-xs w-6">01</span>
            <input id="d-grat-1" type="text" placeholder="..." class="input-field flex-1 rounded-lg px-3.5 py-2 text-sm">
          </div>
          <div class="flex items-center gap-2">
            <span class="text-red-600 font-black italic text-xs w-6">02</span>
            <input id="d-grat-2" type="text" placeholder="..." class="input-field flex-1 rounded-lg px-3.5 py-2 text-sm">
          </div>
          <div class="flex items-center gap-2">
            <span class="text-red-600 font-black italic text-xs w-6">03</span>
            <input id="d-grat-3" type="text" placeholder="..." class="input-field flex-1 rounded-lg px-3.5 py-2 text-sm">
          </div>
        </div>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-2">Objectives</label>
        <div id="objectives-list" class="space-y-2 mb-4">
          <div class="flex items-center gap-3 cursor-pointer obj-row" data-key="obj-workout">
            <div class="check-box w-5 h-5 rounded border border-zinc-700 flex items-center justify-center shrink-0">
              <svg class="check-icon hidden" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <span class="text-sm text-zinc-300">Complete Workout / BJJ</span>
          </div>
          <div class="flex items-center gap-3 cursor-pointer obj-row" data-key="obj-hydration">
            <div class="check-box w-5 h-5 rounded border border-zinc-700 flex items-center justify-center shrink-0">
              <svg class="check-icon hidden" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <span class="text-sm text-zinc-300">Hydration Goal</span>
          </div>
          <div class="flex items-center gap-3 cursor-pointer obj-row" data-key="obj-checkin">
            <div class="check-box w-5 h-5 rounded border border-zinc-700 flex items-center justify-center shrink-0">
              <svg class="check-icon hidden" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <span class="text-sm text-zinc-300">Check in with a Friend</span>
          </div>
        </div>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Today's Goals</label>
        <textarea id="d-goals" rows="3" placeholder="What does a win look like today?" class="textarea-field w-full rounded-lg px-3.5 py-2.5 text-sm resize-none"></textarea>
      </div>

      <!-- Evening Review -->
      <div class="card rounded-xl p-4">
        <h3 class="font-black italic uppercase text-red-600 text-xs tracking-[0.2em] mb-4 flex items-center gap-2">
          <span class="w-1.5 h-1.5 bg-red-600 rounded-full inline-block"></span> Evening Review
        </h3>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Daily Update / Brain Dump</label>
        <textarea id="d-braindump" rows="4" placeholder="Let it out. No filter." class="textarea-field w-full rounded-lg px-3.5 py-2.5 text-sm resize-none mb-4"></textarea>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Steps Taken Today</label>
        <textarea id="d-steps-today" rows="3" placeholder="What did you actually do?" class="textarea-field w-full rounded-lg px-3.5 py-2.5 text-sm resize-none mb-4"></textarea>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Steps For Tomorrow (Reduce the Friction)</label>
        <textarea id="d-steps-tomorrow" rows="3" placeholder="Make it easy for future you." class="textarea-field w-full rounded-lg px-3.5 py-2.5 text-sm resize-none"></textarea>
      </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-5 py-4 bg-gradient-to-t from-black via-black to-transparent">
      <button id="btn-save-daily" class="btn-primary w-full text-white font-black italic uppercase tracking-wide text-sm py-4 rounded-xl">
        Save Entry
      </button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(async function(){
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const session = await requireSession();
  if(!session) return;

  let currentObjectives = {};

  const AFFIRMATIONS = [
    "I am built for this.",
    "Discipline is a form of self-respect.",
    "I don't wait for motivation, I show up anyway.",
    "Every rep is a vote for who I'm becoming.",
    "I choose hard now so the rest gets easier.",
    "I am not fragile. I am forged.",
    "Comfort is not the goal. Growth is.",
    "I trust the work I've put in.",
    "I show up especially when I don't feel like it.",
    "I am exactly where I need to be to get where I'm going.",
    "Pressure reveals who I really am.",
    "I compete with who I was yesterday.",
    "I don't need to feel ready to start.",
    "My effort today is a promise to my future self.",
    "I control my attitude, my effort, and my focus.",
    "Tapping out of comfort is how I grow.",
    "I am consistent, even when no one's watching.",
    "I earn my confidence one rep, one round, one day at a time.",
    "Struggle is where I get stronger, not where I quit.",
    "I show up for myself the way I'd show up for someone I love.",
    "Small disciplines repeated daily lead to big results.",
    "I don't need permission to take my life seriously.",
    "I am capable of more than my doubts tell me.",
    "Today I choose accountability over excuses.",
    "I don't rise to the occasion, I fall to my preparation, so I prepare.",
    "The version of me that quits is not the version I'm building.",
    "I can do hard things. I've done them before.",
    "My standards don't lower just because I'm tired.",
    "I am the one who keeps the promises I make to myself.",
    "Getting tapped is data, not defeat.",
    "I train my mind the same way I train my body.",
    "I don't need to be perfect, I need to be present.",
    "The mat doesn't lie, and neither do I.",
    "I respect the process more than the outcome.",
    "I show up before I feel like it, every time.",
    "Discomfort today is strength tomorrow.",
    "I am not my worst round. I am how I respond to it.",
    "Consistency beats intensity in the long run.",
    "I don't need an audience to give my full effort.",
    "I choose the harder right over the easier wrong.",
    "My word to myself is non-negotiable.",
    "I am allowed to be a beginner and still show up.",
    "Every tap, every loss, every hard day is tuition, not failure.",
    "I build myself in the moments no one applauds.",
    "I am not behind. I am on my own timeline.",
    "Showing up is 90% of the fight.",
    "I don't need to feel strong to act strong.",
    "The reps I don't want to do are the ones that count most.",
    "I keep my agreements with myself first.",
    "I am someone who finishes what they start.",
    "Today's discomfort is tomorrow's confidence.",
    "I train like the outcome depends on it, because it does.",
    "I don't compare my chapter one to someone else's chapter twenty.",
    "I am proud of the work, regardless of the applause.",
    "My resilience is built one hard day at a time.",
    "I show up for the version of me I'm becoming.",
    "I don't need to win every round to be winning.",
    "Adversity is where I find out who I actually am.",
    "I choose growth over the illusion of comfort.",
    "I am disciplined because I respect my future self.",
    "The work doesn't need to feel good to be good for me.",
    "I don't quit on bad days, I just show up smaller.",
    "I am building a life I don't need to escape from.",
    "Every check-in with myself is an act of self-respect.",
    "I trust the process even when I can't see the progress.",
    "I show up fully, not just physically.",
    "I am stronger than the excuse I almost made today.",
    "The hardest part is starting, and I've already started."
  ];

  // Deterministic pick so the same date always gets the same affirmation unless shuffled
  function hashStringToInt(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function pickAffirmationForDate(dateStr){
    const idx = hashStringToInt(dateStr) % AFFIRMATIONS.length;
    return AFFIRMATIONS[idx];
  }
  function setAffirmation(text){
    document.getElementById('d-affirmation-display').textContent = text;
    document.getElementById('d-affirmation').value = text;
  }

  function fmtDate(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayStr(){ return fmtDate(new Date()); }
  function parseDate(str){ const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
  function humanDate(str){ const d = parseDate(str); return `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; }
  function getParam(name){ return new URLSearchParams(window.location.search).get(name); }

  const selectedDate = getParam('date') || todayStr();
  document.getElementById('daily-date-title').textContent = humanDate(selectedDate);

  const { data: entry, error } = await sb
    .from('entries')
    .select('*')
    .eq('user_id', session.user.id)
    .eq('entry_date', selectedDate)
    .maybeSingle();
  if(error) console.error(error);

  // Use the previously saved affirmation if one exists for this day, otherwise auto-generate one
  setAffirmation((entry && entry.affirmation) || pickAffirmationForDate(selectedDate));

  document.getElementById('btn-shuffle-affirmation').addEventListener('click', ()=>{
    const current = document.getElementById('d-affirmation').value;
    let next = current;
    while(next === current && AFFIRMATIONS.length > 1){
      next = AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)];
    }
    setAffirmation(next);
  });

  if(entry){
    document.getElementById('d-grat-1').value = (entry.gratitude && entry.gratitude[0]) || '';
    document.getElementById('d-grat-2').value = (entry.gratitude && entry.gratitude[1]) || '';
    document.getElementById('d-grat-3').value = (entry.gratitude && entry.gratitude[2]) || '';
    document.getElementById('d-goals').value = entry.goals || '';
    document.getElementById('d-braindump').value = entry.brain_dump || '';
    document.getElementById('d-steps-today').value = entry.steps_today || '';
    document.getElementById('d-steps-tomorrow').value = entry.steps_tomorrow || '';
    currentObjectives = entry.objectives || {};
  }

  document.querySelectorAll('.obj-row').forEach(row=>{
    const key = row.dataset.key;
    const checked = !!currentObjectives[key];
    row.querySelector('.check-box').classList.toggle('checked', checked);
    row.querySelector('.check-icon').classList.toggle('hidden', !checked);
    row.addEventListener('click', ()=>{
      currentObjectives[key] = !currentObjectives[key];
      row.querySelector('.check-box').classList.toggle('checked', currentObjectives[key]);
      row.querySelector('.check-icon').classList.toggle('hidden', !currentObjectives[key]);
    });
  });

  document.getElementById('btn-save-daily').addEventListener('click', async ()=>{
    const btn = document.getElementById('btn-save-daily');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const payload = {
      user_id: session.user.id,
      entry_date: selectedDate,
      affirmation: document.getElementById('d-affirmation').value,
      gratitude: [
        document.getElementById('d-grat-1').value,
        document.getElementById('d-grat-2').value,
        document.getElementById('d-grat-3').value
      ],
      objectives: currentObjectives,
      goals: document.getElementById('d-goals').value,
      brain_dump: document.getElementById('d-braindump').value,
      steps_today: document.getElementById('d-steps-today').value,
      steps_tomorrow: document.getElementById('d-steps-tomorrow').value,
      saved_at: new Date().toISOString()
    };

    const { error } = await sb.from('entries').upsert(payload, { onConflict: 'user_id,entry_date' });
    if(error){
      console.error(error);
      btn.disabled = false;
      btn.textContent = 'Save Entry';
      alert('Could not save — check your connection and try again.');
      return;
    }
    window.location.href = 'index.html';
  });

  document.getElementById('loading-overlay').classList.add('hidden');
  document.getElementById('app-content').classList.remove('hidden');
})();
</script>
</body>
</html>
