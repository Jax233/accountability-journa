<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>User Profile — I SEE YOU & YOU ARE PERFECT</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I SEE YOU">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  html, body { background:#000; }
  .card { background:#0a0a0b; border:1px solid #18181b; }
  .input-field, .select-field { background:#0a0a0b; border:1px solid #27272a; color:#fafafa; transition: all .2s ease; }
  .input-field:focus, .select-field:focus { outline: none; border-color:#dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.18); }
  
  .belt-btn { transition: all .2s ease; border: 2px solid transparent; }
  .belt-btn.selected { border-color: #dc2626; transform: scale(1.02); }
  
  .btn-primary { background:#dc2626; box-shadow: 0 0 22px rgba(220,38,38,0.35); transition: all .18s ease; }
  .btn-primary:hover { background:#ef4444; }

  #loading-overlay { background:#000; }
  .spinner { border: 2.5px solid #27272a; border-top-color:#dc2626; border-radius:50%; width:28px; height:28px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-black text-zinc-100">
<div class="max-w-md mx-auto min-h-screen bg-black flex flex-col relative border-x border-zinc-900">

  <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="spinner"></div>
  </div>

  <div id="app-content" class="hidden flex-1 flex flex-col">
    <!-- Header -->
    <div class="sticky top-0 z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="flex-1">
        <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Account Settings</p>
        <h2 class="font-black italic uppercase text-base leading-tight">Practitioner Profile</h2>
      </div>
      <img src="logo-bird-only-v2.png" alt="I See You" class="h-8 w-auto shrink-0">
    </div>

    <div class="flex-1 px-5 py-5 space-y-5 pb-28">
      <!-- Profile Details -->
      <div class="card rounded-xl p-4">
        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Full Name / Mat Alias</label>
        <input id="p-name" type="text" placeholder="e.g. Rickson Gracie" class="input-field w-full rounded-lg px-3.5 py-2.5 text-sm mb-4">

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-2">Belt Rank</label>
        <div class="grid grid-cols-1 gap-2 mb-4">
          <button type="button" class="belt-btn flex items-center justify-between p-3 rounded-lg bg-zinc-900 border border-zinc-800" data-belt="White Belt">
            <span class="font-bold text-xs uppercase text-white">White Belt</span>
            <span class="w-12 h-3 bg-white border border-zinc-400 rounded-sm"></span>
          </button>
          <button type="button" class="belt-btn flex items-center justify-between p-3 rounded-lg bg-zinc-900 border border-zinc-800" data-belt="Blue Belt">
            <span class="font-bold text-xs uppercase text-blue-400">Blue Belt</span>
            <span class="w-12 h-3 bg-blue-600 rounded-sm"></span>
          </button>
          <button type="button" class="belt-btn flex items-center justify-between p-3 rounded-lg bg-zinc-900 border border-zinc-800" data-belt="Purple Belt">
            <span class="font-bold text-xs uppercase text-purple-400">Purple Belt</span>
            <span class="w-12 h-3 bg-purple-600 rounded-sm"></span>
          </button>
          <button type="button" class="belt-btn flex items-center justify-between p-3 rounded-lg bg-zinc-900 border border-zinc-800" data-belt="Brown Belt">
            <span class="font-bold text-xs uppercase text-amber-700">Brown Belt</span>
            <span class="w-12 h-3 bg-amber-800 rounded-sm"></span>
          </button>
          <button type="button" class="belt-btn flex items-center justify-between p-3 rounded-lg bg-zinc-900 border border-zinc-800" data-belt="Black Belt">
            <span class="font-bold text-xs uppercase text-red-500">Black Belt</span>
            <span class="w-12 h-3 bg-zinc-950 border border-red-600 rounded-sm"></span>
          </button>
        </div>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Stripes</label>
        <select id="p-stripes" class="select-field w-full rounded-lg px-3.5 py-2.5 text-sm mb-4">
          <option value="0">0 Stripes</option>
          <option value="1">1 Stripe</option>
          <option value="2">2 Stripes</option>
          <option value="3">3 Stripes</option>
          <option value="4">4 Stripes</option>
        </select>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Primary Style Focus</label>
        <select id="p-style" class="select-field w-full rounded-lg px-3.5 py-2.5 text-sm">
          <option value="Balanced">Balanced / All-Rounder</option>
          <option value="Guard Player">Guard Player (Bottom Focus)</option>
          <option value="Top Passer">Top Passer (Pin & Pressure)</option>
          <option value="Leg Locker">Leg Entanglement Specialist</option>
        </select>
      </div>
    </div>

    <!-- Save Button -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-5 py-4 bg-gradient-to-t from-black via-black to-transparent">
      <button id="btn-save-profile" class="btn-primary w-full text-white font-black italic uppercase tracking-wide text-sm py-4 rounded-xl">
        Save Profile
      </button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(async function(){
  const session = await requireSession();
  if(!session) return;

  let selectedBelt = 'White Belt';

  // Fetch profile if exists
  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  
  if(profile){
    document.getElementById('p-name').value = profile.full_name || '';
    selectedBelt = profile.belt_rank || 'White Belt';
    document.getElementById('p-stripes').value = profile.stripes || 0;
    document.getElementById('p-style').value = profile.game_style || 'Balanced';
  }

  function updateBeltUI(){
    document.querySelectorAll('.belt-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.belt === selectedBelt);
    });
  }
  updateBeltUI();

  document.querySelectorAll('.belt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedBelt = btn.dataset.belt;
      updateBeltUI();
    });
  });

  document.getElementById('btn-save-profile').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save-profile');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const payload = {
      id: session.user.id,
      full_name: document.getElementById('p-name').value,
      belt_rank: selectedBelt,
      stripes: parseInt(document.getElementById('p-stripes').value, 10),
      game_style: document.getElementById('p-style').value,
      updated_at: new Date().toISOString()
    };

    const { error } = await sb.from('profiles').upsert(payload);
    if(error){
      console.error(error);
      alert('Could not update profile.');
      btn.disabled = false;
      btn.textContent = 'Save Profile';
      return;
    }
    window.location.href = 'index.html';
  });

  document.getElementById('loading-overlay').classList.add('hidden');
  document.getElementById('app-content').classList.remove('hidden');
})();
</script>
</body>
</html>
