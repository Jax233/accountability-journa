<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Training Log — I SEE YOU & YOU ARE PERFECT</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I SEE YOU">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  html, body { background:#000; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #000000; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

  .input-field, .textarea-field { background:#0a0a0b; border:1px solid #27272a; color:#fafafa; transition: all .2s ease; }
  .input-field:focus, .textarea-field:focus { outline: none; border-color:#dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.18), 0 0 18px rgba(220,38,38,0.25); }
  .input-field::placeholder, .textarea-field::placeholder { color:#52525b; }

  .btn-primary { background:#dc2626; box-shadow: 0 0 22px rgba(220,38,38,0.35); transition: all .18s ease; }
  .btn-primary:hover { background:#ef4444; box-shadow: 0 0 32px rgba(220,38,38,0.55); }
  .btn-primary:disabled { opacity:.6; }
  .card { background:#0a0a0b; border:1px solid #18181b; }
  .mood-btn { transition: all .15s ease; border:1.5px solid #27272a; }
  .mood-btn.selected { border-color:#dc2626; background: rgba(220,38,38,0.12); box-shadow: 0 0 16px rgba(220,38,38,0.35); }

  #loading-overlay { background:#000; }
  .spinner { border: 2.5px solid #27272a; border-top-color:#dc2626; border-radius:50%; width:28px; height:28px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-black text-zinc-100">
<div class="max-w-md mx-auto min-h-screen bg-black flex flex-col relative border-x border-zinc-900">

  <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="spinner"></div>
  </div>

  <div id="app-content" class="hidden flex-1 flex flex-col">
    <div class="sticky top-0 z-10 bg-black/95 backdrop-blur border-b border-zinc-900 px-5 py-4 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-zinc-900 text-zinc-300 hover:text-red-500 transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="flex-1">
        <p class="text-[10px] text-red-600 font-bold uppercase tracking-[0.25em]">Mat Session Tracker</p>
        <h2 id="training-date-title" class="font-black italic uppercase text-base leading-tight"></h2>
      </div>
      <img src="logo-bird-only-v2.png" alt="I See You & You Are Perfect" class="h-8 w-auto shrink-0">
    </div>

    <div class="flex-1 px-5 py-5 space-y-5 pb-28">
      <div class="card rounded-xl p-4">
        <h3 class="font-black italic uppercase text-red-600 text-xs tracking-[0.2em] mb-4 flex items-center gap-2">
          <span class="w-1.5 h-1.5 bg-red-600 rounded-full inline-block"></span> Mat Details
        </h3>
        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Class Attended</label>
        <input id="t-class" type="text" placeholder="e.g. Gi Fundamentals, No-Gi Open Mat" class="input-field w-full rounded-lg px-3.5 py-2.5 text-sm mb-4">

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Coach</label>
        <input id="t-coach" type="text" placeholder="Who ran the room?" class="input-field w-full rounded-lg px-3.5 py-2.5 text-sm mb-4">

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Training Partners</label>
        <input id="t-partners" type="text" placeholder="Who'd you roll with?" class="input-field w-full rounded-lg px-3.5 py-2.5 text-sm mb-4">

        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500">Technique Focus</label>
          <a href="bjj-flow.html" target="_blank" rel="noopener noreferrer" class="text-[10px] font-bold text-red-500 hover:text-red-400 uppercase tracking-wider transition flex items-center gap-1">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Flow Diagram →
          </a>
        </div>
        <input id="t-focus" type="text" placeholder="e.g. Guard Retention, Kimura Trap" class="input-field w-full rounded-lg px-3.5 py-2.5 text-sm mb-4">

        <button id="btn-attach-media" type="button" class="w-full flex items-center justify-center gap-2 border border-dashed border-zinc-700 hover:border-red-600 rounded-lg py-3 text-zinc-400 hover:text-red-500 text-xs font-bold uppercase tracking-wide transition">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          Attach Photo / Video
        </button>
      </div>

      <div class="card rounded-xl p-4">
        <h3 class="font-black italic uppercase text-red-600 text-xs tracking-[0.2em] mb-4 flex items-center gap-2">
          <span class="w-1.5 h-1.5 bg-red-600 rounded-full inline-block"></span> Reflection
        </h3>
        
        <!-- Concept Banner (Visible when logged from Flow Map) -->
        <div id="concept-context-box" class="hidden bg-zinc-950 rounded-xl p-3 border border-red-950 mb-4">
          <p class="text-[9px] font-black uppercase tracking-widest text-red-500 mb-1">Target Concept (Background Process)</p>
          <p id="concept-context-text" class="text-xs text-zinc-300 italic leading-relaxed"></p>
        </div>

        <label id="learned-question-label" class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">What Did You Learn?</label>
        <textarea id="t-learned" rows="3" placeholder="How did the background process affect your rolls today?" class="textarea-field w-full rounded-lg px-3.5 py-2.5 text-sm resize-none mb-4"></textarea>

        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-1.5">Follow-Up Questions</label>
        <textarea id="t-questions" rows="3" placeholder="What do you need to ask your coach?" class="textarea-field w-full rounded-lg px-3.5 py-2.5 text-sm resize-none"></textarea>
      </div>

      <div class="card rounded-xl p-4">
        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-2.5">Post-Training Mood</label>
        <div class="grid grid-cols-3 gap-2 mb-5">
          <button class="mood-btn rounded-lg py-3 text-2xl" data-mood="fired-up" type="button">😃</button>
          <button class="mood-btn rounded-lg py-3 text-2xl" data-mood="neutral" type="button">😐</button>
          <button class="mood-btn rounded-lg py-3 text-2xl" data-mood="wrecked" type="button">😤</button>
        </div>
        <label class="block text-[11px] font-bold uppercase tracking-wide text-zinc-500 mb-2.5">Sparring Rounds Rolled</label>
        <div class="flex items-center justify-between bg-black border border-zinc-800 rounded-lg px-4 py-2.5">
          <button id="rounds-minus" type="button" class="w-9 h-9 flex items-center justify-center rounded-md text-red-500 hover:bg-zinc-900 text-xl font-black">−</button>
          <span id="rounds-value" class="text-2xl font-black italic">0</span>
          <button id="rounds-plus" type="button" class="w-9 h-9 flex items-center justify-center rounded-md text-red-500 hover:bg-zinc-900 text-xl font-black">+</button>
        </div>
      </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-5 py-4 bg-gradient-to-t from-black via-black to-transparent">
      <button id="btn-save-training" class="btn-primary w-full text-white font-black italic uppercase tracking-wide text-sm py-4 rounded-xl">
        Save Training Log
      </button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(async function(){
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const session = await requireSession();
  if(!session) return;

  let currentMood = null;
  let currentRounds = 0;
  let existingId = null;

  function fmtDate(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayStr(){ return fmtDate(new Date()); }
  function parseDate(str){ const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
  function humanDate(str){ const d = parseDate(str); return `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; }
  function getParam(name){ return new URLSearchParams(window.location.search).get(name); }

  const selectedDate = getParam('date') || todayStr();
  const autoFocusTechnique = getParam('focus');
  const autoConcept = getParam('concept');

  document.getElementById('training-date-title').textContent = humanDate(selectedDate);

  // Dynamically tailor Reflection based on the selected Concept
  if (autoFocusTechnique) {
    document.getElementById('t-focus').value = decodeURIComponent(autoFocusTechnique);
  }

  if (autoConcept) {
    const conceptText = decodeURIComponent(autoConcept);
    
    // Display concept banner
    document.getElementById('concept-context-box').classList.remove('hidden');
    document.getElementById('concept-context-text').textContent = conceptText;

    // Tailor the "What Did You Learn?" question and placeholder dynamically
    const questionLabel = document.getElementById('learned-question-label');
    const learnedInput = document.getElementById('t-learned');

    questionLabel.textContent = `Concept Reflection: ${decodeURIComponent(autoFocusTechnique)}`;
    learnedInput.placeholder = `Focus question: Did you successfully control the background process? (${conceptText})`;
  }

  const { data: sessions, error } = await sb
    .from('trainings')
    .select('*')
    .eq('user_id', session.user.id)
    .eq('training_date', selectedDate)
    .order('saved_at', { ascending: true });
  if(error) console.error(error);

  const last = (sessions && sessions[sessions.length-1]) || null;
  if(last){
    existingId = last.id;
    document.getElementById('t-class').value = last.class_attended || '';
    document.getElementById('t-coach').value = last.coach || '';
    document.getElementById('t-partners').value = last.partners || '';
    if (!autoFocusTechnique) document.getElementById('t-focus').value = last.focus || '';
    document.getElementById('t-learned').value = last.learned || '';
    document.getElementById('t-questions').value = last.questions || '';
    currentMood = last.mood || null;
    currentRounds = last.rounds || 0;
  }
  document.querySelectorAll('.mood-btn').forEach(b=> b.classList.toggle('selected', b.dataset.mood === currentMood));
  document.getElementById('rounds-value').textContent = currentRounds;

  document.querySelectorAll('.mood-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentMood = btn.dataset.mood;
      document.querySelectorAll('.mood-btn').forEach(b=> b.classList.toggle('selected', b === btn));
    });
  });
  document.getElementById('rounds-plus').addEventListener('click', ()=>{
    currentRounds++;
    document.getElementById('rounds-value').textContent = currentRounds;
  });
  document.getElementById('rounds-minus').addEventListener('click', ()=>{
    currentRounds = Math.max(0, currentRounds-1);
    document.getElementById('rounds-value').textContent = currentRounds;
  });
  document.getElementById('btn-attach-media').addEventListener('click', ()=>{
    alert('Media attachment coming soon.');
  });

  document.getElementById('btn-save-training').addEventListener('click', async ()=>{
    const btn = document.getElementById('btn-save-training');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const record = {
      user_id: session.user.id,
      training_date: selectedDate,
      class_attended: document.getElementById('t-class').value,
      coach: document.getElementById('t-coach').value,
      partners: document.getElementById('t-partners').value,
      focus: document.getElementById('t-focus').value,
      learned: document.getElementById('t-learned').value,
      questions: document.getElementById('t-questions').value,
      mood: currentMood,
      rounds: currentRounds,
      saved_at: new Date().toISOString()
    };

    let dbError;
    if(existingId){
      const { error } = await sb.from('trainings').update(record).eq('id', existingId);
      dbError = error;
    } else {
      const { error } = await sb.from('trainings').insert(record);
      dbError = error;
    }

    if(dbError){
      console.error(dbError);
      btn.disabled = false;
      btn.textContent = 'Save Training Log';
      alert('Could not save — check your connection and try again.');
      return;
    }
    window.location.href = 'index.html';
  });

  document.getElementById('loading-overlay').classList.add('hidden');
  document.getElementById('app-content').classList.remove('hidden');
})();
</script>
</body>
</html>
